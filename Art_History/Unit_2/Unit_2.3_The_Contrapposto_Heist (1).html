<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Contrapposto Heist — Unit 2.3 Case Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --papyrus:#EDE4D3;
  --papyrus-dark:#DED0AE;
  --paper-edge:#C9B98C;
  --ink:#211A13;
  --ink-soft:#4A4038;
  --terracotta:#B5502E;
  --terracotta-dark:#8A3B1E;
  --terracotta-light:#D97A52;
  --marble:#A9A296;
  --marble-light:#E7E2D6;
  --laurel:#5C6B47;
  --laurel-dark:#414D31;
  --wax:#9C2B1F;
  --gold:#C9A227;
  --gold-light:#E6C158;
  --shadow: 0 8px 24px rgba(33,26,19,0.18);
  --shadow-sm: 0 3px 10px rgba(33,26,19,0.14);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--papyrus);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(181,80,46,0.05), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(92,107,71,0.06), transparent 40%);
  font-family:'Inter',sans-serif;
  color: var(--ink);
  min-height:100vh;
}
.stamp-font{font-family:'Space Mono',monospace;}
h1,h2,h3,.display{font-family:'Cinzel',serif;}
#app{max-width:1000px;margin:0 auto;padding:18px 18px 60px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.sr-only{position:absolute;left:-9999px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px 18px;border-bottom:3px solid var(--ink);
  margin-bottom:22px;
}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.topbar .brand .seal{
  width:44px;height:44px;border-radius:50%;background:var(--terracotta);
  display:flex;align-items:center;justify-content:center;color:var(--papyrus);
  font-family:'Cinzel',serif;font-weight:900;font-size:20px;border:2px solid var(--ink);
  flex-shrink:0;
}
.topbar .brand h1{font-size:1.05rem;margin:0;letter-spacing:.5px;line-height:1.15;}
.topbar .brand .kicker{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:1.5px;color:var(--terracotta-dark);text-transform:uppercase;}
.topbar nav button{
  font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.5px;
  color:var(--ink-soft);padding:8px 12px;border-radius:6px;text-transform:uppercase;
}
.topbar nav button:hover{background:rgba(33,26,19,0.06);}
.topbar nav button.active{background:var(--ink);color:var(--papyrus);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:8px;font-weight:700;font-size:.92rem;
  background:var(--ink);color:var(--papyrus);box-shadow:var(--shadow-sm);
  transition:transform .1s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn.primary{background:var(--terracotta);}
.btn.gold{background:var(--gold);color:var(--ink);}
.btn.laurel{background:var(--laurel);color:var(--papyrus);}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center;}

/* ---------- Hub / Corkboard ---------- */
.corkboard{
  background: linear-gradient(180deg, #C9B98C, #BBA876);
  border-radius: 14px;
  padding: 28px 22px 34px;
  box-shadow: inset 0 0 0 3px rgba(33,26,19,0.15), var(--shadow);
  position:relative;
  margin-bottom:28px;
}
.corkboard::before{
  content:"";position:absolute;inset:0;border-radius:14px;
  background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
  background-size: 9px 9px; opacity:.5; pointer-events:none;
}
.hero-line{
  text-align:center;margin-bottom:26px;position:relative;z-index:1;
}
.hero-line .eyebrow{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:2px;color:var(--wax);text-transform:uppercase;}
.hero-line h2{font-size:1.7rem;margin:6px 0 8px;color:var(--ink);}
.hero-line p{max-width:560px;margin:0 auto;color:var(--ink-soft);font-size:.95rem;line-height:1.5;}

.thread{
  position:relative;
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
  margin-top:6px;z-index:1;
}
.thread::before{
  content:"";position:absolute;top:34px;left:6%;right:6%;height:3px;
  background:repeating-linear-gradient(90deg, var(--wax) 0 10px, transparent 10px 16px);
  z-index:0;
}
.folder{
  position:relative;z-index:1;
  background:var(--papyrus);
  border-radius:6px;
  padding:16px 12px 14px;
  box-shadow:var(--shadow-sm);
  border:2px solid var(--ink);
  text-align:left;
  transition:transform .12s ease;
  display:flex;flex-direction:column;gap:8px;min-height:170px;
}
.folder:hover{transform:translateY(-4px) rotate(-0.5deg);}
.folder .pin{
  width:16px;height:16px;border-radius:50%;background:var(--wax);
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  box-shadow:0 2px 3px rgba(0,0,0,.4);border:2px solid #6e1a11;
}
.folder .num{
  font-family:'Space Mono',monospace;font-size:.68rem;color:var(--terracotta-dark);letter-spacing:1px;
}
.folder .icon{font-size:1.6rem;}
.folder h3{font-size:.98rem;margin:0;line-height:1.25;}
.folder .sub{font-size:.74rem;color:var(--ink-soft);line-height:1.3;}
.folder .stamp{
  margin-top:auto;align-self:flex-start;
  font-family:'Space Mono',monospace;font-size:.68rem;font-weight:700;
  padding:3px 8px;border-radius:20px;letter-spacing:.5px;
}
.stamp.bronze{background:#CD8B4E;color:#3a2410;}
.stamp.silver{background:#C7CDD6;color:#2a2f36;}
.stamp.gold{background:var(--gold-light);color:#3a2b04;}
.stamp.new{background:var(--marble-light);color:var(--ink-soft);}

.extra-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1;}
.extra-card{
  flex:1;min-width:220px;background:rgba(255,255,255,0.5);border:2px dashed var(--ink);
  border-radius:8px;padding:14px 14px;
}
.extra-card h4{margin:0 0 4px;font-size:.85rem;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--terracotta-dark);}
.extra-card p{margin:0 0 10px;font-size:.85rem;color:var(--ink-soft);line-height:1.4;}

/* ---------- Case screen ---------- */
.case-header{
  display:flex;align-items:center;gap:14px;margin-bottom:6px;
}
.case-header .icon-badge{
  width:52px;height:52px;border-radius:10px;background:var(--ink);color:var(--papyrus);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;
}
.case-header h2{margin:0;font-size:1.4rem;}
.case-header .sub{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--terracotta-dark);letter-spacing:1px;text-transform:uppercase;}
.progress-dots{display:flex;gap:6px;margin:16px 0 22px;}
.progress-dots span{width:26px;height:6px;border-radius:4px;background:var(--marble);}
.progress-dots span.done{background:var(--laurel);}
.progress-dots span.current{background:var(--terracotta);}

.card{
  background:var(--marble-light);
  border-radius:var(--radius);
  border:2px solid var(--ink);
  padding:24px;
  box-shadow:var(--shadow-sm);
  margin-bottom:18px;
}
.card h3{margin-top:0;}
.activity-label{
  font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--terracotta-dark);margin-bottom:10px;display:block;
}

/* ---------- Flashcards ---------- */
.flashwrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.flashcount{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--ink-soft);}
.flashcard{
  width:100%;max-width:480px;min-height:190px;
  background:var(--papyrus);border:2px solid var(--ink);border-radius:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:26px 22px;box-shadow:var(--shadow-sm);position:relative;
}
.flashcard .fterm{font-family:'Cinzel',serif;font-size:1.25rem;font-weight:700;}
.flashcard .fdef{font-size:1rem;line-height:1.5;color:var(--ink-soft);}
.flashcard .hint{position:absolute;bottom:10px;right:14px;font-family:'Space Mono',monospace;font-size:.65rem;color:var(--marble);}
.flash-nav{display:flex;align-items:center;gap:14px;}
.flash-nav button{font-size:1.3rem;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--papyrus);}
.self-report{display:flex;gap:10px;margin-top:6px;}
.self-report button{font-size:.8rem;padding:8px 14px;border-radius:20px;border:2px solid var(--ink);}
.self-report button.got{color:var(--laurel-dark);}
.self-report button.review{color:var(--wax);}

/* ---------- MCQ ---------- */
.mcq-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--ink-soft);}
.mcq-q{font-size:1.08rem;font-weight:700;margin-bottom:16px;line-height:1.4;}
.mcq-opts{display:flex;flex-direction:column;gap:10px;}
.mcq-opt{
  text-align:left;padding:13px 16px;border:2px solid var(--ink);border-radius:8px;
  background:var(--papyrus);font-size:.95rem;font-weight:600;
}
.mcq-opt:hover{background:var(--papyrus-dark);}
.mcq-opt.correct{background:var(--laurel);color:var(--papyrus);border-color:var(--laurel-dark);}
.mcq-opt.wrong{background:var(--wax);color:var(--papyrus);border-color:#6e1a11;}
.mcq-opt.disabled{pointer-events:none;}
.mcq-opt.reveal{opacity:.55;}
.mcq-explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--papyrus);
  border-left:4px solid var(--terracotta);font-size:.88rem;line-height:1.5;display:none;
}
.mcq-explain.show{display:block;}

/* ---------- Word bank / diagram ---------- */
.diagram-wrap{display:flex;justify-content:center;margin-bottom:18px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
.chip{
  padding:9px 14px;border:2px solid var(--ink);border-radius:20px;font-size:.85rem;font-weight:700;
  background:var(--papyrus);
}
.chip.selected{background:var(--gold-light);}
.chip.used{opacity:.3;pointer-events:none;}
.slots{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto;}
.slot-row{display:flex;align-items:center;gap:10px;}
.slot-num{
  width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--papyrus);
  display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;
}
.slot{
  flex:1;min-height:38px;border:2px dashed var(--ink);border-radius:6px;
  display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:.9rem;background:var(--papyrus);
}
.slot.filled{border-style:solid;background:var(--gold-light);}
.slot.correct{border-style:solid;background:var(--laurel);color:var(--papyrus);border-color:var(--laurel-dark);}
.slot.wrong{border-style:solid;background:var(--wax);color:var(--papyrus);border-color:#6e1a11;}
.slot .answer-key{font-family:'Space Mono',monospace;font-size:.7rem;margin-left:8px;opacity:.85;}

/* ---------- Evidence compare ---------- */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){.compare-grid{grid-template-columns:1fr;}}
.compare-col{background:var(--papyrus);border:2px solid var(--ink);border-radius:10px;padding:16px;}
.compare-col h4{margin:0 0 10px;font-family:'Cinzel',serif;font-size:1rem;}
.evidence-toggle{
  width:100%;text-align:left;background:var(--ink);color:var(--papyrus);border-radius:8px;
  padding:12px 16px;font-weight:700;margin:16px 0 0;display:flex;justify-content:space-between;align-items:center;
}
.evidence-panel{display:none;padding:14px 16px;background:var(--marble-light);border-radius:0 0 8px 8px;border:2px solid var(--ink);border-top:none;}
.evidence-panel.show{display:block;}
.evidence-panel ul{margin:0;padding-left:20px;line-height:1.6;}

/* ---------- Pose build (Case 3 climax) ---------- */
.pose-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
@media (max-width:640px){.pose-grid{grid-template-columns:1fr;}}
.pose-col{text-align:center;}
.pose-col h4{font-family:'Cinzel',serif;margin:8px 0 2px;}
.pose-col .tag{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-soft);}
.markers{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.marker-btn{
  width:30px;height:30px;border-radius:50%;background:var(--terracotta);color:#fff;font-weight:700;font-size:.8rem;
  border:2px solid var(--ink);
}
.marker-btn.active{background:var(--gold);color:var(--ink);}
.pose-caption{
  margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--papyrus);border-left:4px solid var(--wax);
  min-height:52px;font-size:.9rem;line-height:1.5;
}
.heist-reveal{
  margin-top:20px;padding:18px 20px;border-radius:10px;background:var(--ink);color:var(--papyrus);
  font-size:.95rem;line-height:1.6;display:none;
}
.heist-reveal.show{display:block;}
.heist-reveal b{color:var(--gold-light);}

/* ---------- Case complete ---------- */
.complete-box{text-align:center;padding:32px 20px;}
.complete-box .medal{font-size:3rem;}
.complete-box h2{margin:8px 0 4px;}
.score-pill{
  display:inline-block;margin-top:10px;padding:8px 18px;border-radius:20px;
  background:var(--gold-light);font-family:'Space Mono',monospace;font-weight:700;
}

/* ---------- Timeline / final boss ---------- */
.timeline-bank{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.tl-chip{
  padding:12px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--papyrus);
  font-weight:700;font-size:.88rem;max-width:230px;text-align:left;
}
.tl-chip.used{opacity:.25;pointer-events:none;}
.tl-slots{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.tl-slot{
  border:2px dashed var(--ink);border-radius:8px;padding:10px 14px;min-height:40px;
  display:flex;align-items:center;gap:10px;background:var(--papyrus);font-size:.88rem;font-weight:700;
}
.tl-slot .n{font-family:'Space Mono',monospace;color:var(--terracotta-dark);}
.tl-slot.correct{background:var(--laurel);color:var(--papyrus);border-style:solid;}
.tl-slot.wrong{background:var(--wax);color:var(--papyrus);border-style:solid;}

/* ---------- Certificate ---------- */
.certificate{
  border:6px double var(--ink);padding:36px 28px;text-align:center;background:var(--papyrus);
  border-radius:6px;
}
.certificate .eyebrow{font-family:'Space Mono',monospace;letter-spacing:3px;font-size:.72rem;color:var(--terracotta-dark);text-transform:uppercase;}
.certificate h2{font-size:1.8rem;margin:8px 0;}
.certificate .name-line{margin:22px 0;font-size:1.1rem;}
.certificate .name-line input{
  border:none;border-bottom:2px solid var(--ink);background:transparent;font-family:'Cinzel',serif;
  font-size:1.2rem;text-align:center;padding:4px 10px;width:280px;
}
.certificate .seal-final{
  width:80px;height:80px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;margin:14px auto;font-size:1.8rem;
}
@media print{
  .topbar, .btn-row, nav{display:none !important;}
  body{background:#fff;}
}

/* ---------- extensions ---------- */
.ext-list{display:flex;flex-direction:column;gap:14px;}
.ext-item{
  background:var(--marble-light);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;
  display:flex;gap:14px;align-items:flex-start;
}
.ext-item .num{
  font-family:'Cinzel',serif;font-weight:900;font-size:1.4rem;color:var(--terracotta);flex-shrink:0;
}
.ext-item h4{margin:0 0 4px;}
.ext-item p{margin:0;color:var(--ink-soft);font-size:.9rem;line-height:1.5;}
.map-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem;}
.map-table th,.map-table td{border:1px solid var(--marble);padding:7px 10px;text-align:left;}
.map-table th{background:var(--papyrus-dark);font-family:'Space Mono',monospace;font-size:.7rem;text-transform:uppercase;}

footer.foot{text-align:center;margin-top:36px;color:var(--marble);font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:1px;}
</style>
</head>

<div id="app"></div>
<script>
/* =========================================================
   THE CONTRAPPOSTO HEIST — data
   ========================================================= */

const FLASH1 = [
 {t:"Doric Order", d:"The plainest, stockiest column order. No base — it sits right on the floor. Flat, simple capital. Think: no-nonsense."},
 {t:"Ionic Order", d:"A slimmer column with a scroll-shaped capital (volutes) and a base. More decorative than Doric, more restrained than Corinthian."},
 {t:"Corinthian Order", d:"The tallest, fanciest order. Capital covered in carved acanthus leaves. Legend says it was inspired by leaves growing around a basket on a girl's grave."},
 {t:"Entablature", d:"Everything that rests on top of the columns, stacked together: architrave, then frieze, then cornice."},
 {t:"Architrave", d:"The plain horizontal beam resting directly on the columns — the bottom layer of the entablature."},
 {t:"Frieze", d:"The middle band of the entablature — decorated with relief sculpture, or with triglyphs and metopes in Doric temples."},
 {t:"Triglyph", d:"A block with three vertical grooves in a Doric frieze. Alternates with metopes."},
 {t:"Metope", d:"A carved (or plain) panel between two triglyphs on a Doric frieze."},
 {t:"Cornice", d:"The topmost, projecting horizontal band of the entablature — like a roof's overhang."},
 {t:"Pediment", d:"The triangular gable at each end of a temple's roofline, often filled with sculpture."},
 {t:"Cella", d:"The main interior room of a temple — home to the cult statue of the god."},
 {t:"Portico", d:"A porch with columns marking the entrance of a building."},
 {t:"Amphiprostyle", d:"A temple plan with a columned porch on both the front AND the back, but not along the sides."},
 {t:"Stoa", d:"A long, covered walkway lined with columns — used for shopping, socializing, and shelter in the Agora."},
 {t:"Agora", d:"The open public square at the heart of a Greek city — markets, politics, everyday life."},
 {t:"Panathenaic Way", d:"The sacred road running through the Agora, used for the procession honoring Athena."},
 {t:"Tholos", d:"A round building in the Agora, used by city officials as a meeting place and dining hall."},
];

 {q:"What's the triangular space at the end of a temple's roofline called?",o:["Cornice","Pediment","Frieze"],c:1,e:"The pediment is the triangular gable — often filled with sculpture."},
 {q:"In a Doric frieze, the panel BETWEEN two triglyphs is a...",o:["Metope","Cella","Portico"],c:0,e:"Metope = the panel; Triglyph = the three-grooved block beside it."},
 {q:"What was kept inside a temple's cella?",o:["Grain for the city","The cult statue of the god","Nothing — it stayed empty"],c:1,e:"The cella housed the god's statue — it's the whole reason the temple exists."},
 {q:"The Agora was mainly used for...",o:["Athletic competitions only","Civic life — markets, politics, gathering","Burying the dead"],c:1,e:"The Agora was the civic heart of the city."},

  <line x1="140" y1="94" x2="140" y2="120"/><line x1="146" y1="94" x2="146" y2="120"/><line x1="152" y1="94" x2="152" y2="120"/>

   <p>Egyptian sculptors invented it. Greek sculptors copied it. Then one man broke it wide open &mdash; and set off a chain reaction that runs through the entire rest of Greek art. Work the five case files below (any order, your pace) to crack it. Finish them all, then head to <b>Case Closed</b> to line up the whole timeline.</p>
  </div>
  <div class="thread">${folders}</div>
  <div class="extra-row">
   <button class="extra-card" style="text-align:left" onclick="openFinal()">
    <h4>\u{1F4CB} Case Closed &mdash; Final Review</h4>
    <p>Put the whole 1000-year story in order and pick up your case-closed certificate.</p>
    <span class="btn primary" style="pointer-events:none">Open File \u2192</span>
   </button>
   <button class="extra-card" style="text-align:left" onclick="openBonus()">
    <h4>\u{1F575}\uFE0F Stakeout &mdash; Bonus Round</h4>
    <p>Trickier questions mixing up easily-confused terms. Great for early finishers.</p>
    <span class="btn ghost" style="pointer-events:none">Start Stakeout \u2192</span>
   </button>
  </div>
 </div>`;
}

function topbarHTML(){
 return `<div class="topbar">
  <div class="brand">
   <div class="seal">\u{1F3FA}</div>
   <div>
    <div class="kicker">Unit 2.3 &middot; Case Files</div>
    <h1>The Contrapposto Heist</h1>
   </div>
  </div>
  <nav>
   <button class="${state.screen==='home'?'active':''}" onclick="goHome()">Evidence Wall</button>
   <button class="${state.screen==='extensions'?'active':''}" onclick="openExtensions()">Take It Home</button>
  </nav>
 </div>`;
}

render();
</script>
