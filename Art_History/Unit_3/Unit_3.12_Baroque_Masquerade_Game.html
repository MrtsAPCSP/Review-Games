<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Masquerade of Shadow and Splendor</title>
<style>
  :root{
    --bg: #0b0906;
    --bg-2: #16110d;
    --bg-3: #1f1712;
    --gold: #c9a24d;
    --gold-bright: #f0cf7f;
    --gold-dim: #8a6e33;
    --wine: #5c1a24;
    --wine-light: #8a2c3a;
    --parchment: #ecdfc2;
    --parchment-dim: #b9ab8c;
    --ink: #150f0c;
    --teal: #1f4741;
    --teal-light: #35695f;
    --danger: #a13232;
    --success: #4a7c4e;
    --italian: #7a2634;
    --spanish: #6b1414;
    --flemish: #2d5233;
    --dutch: #1f4741;
    --french: #4a5568;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    --font-label: 'Trebuchet MS', 'Segoe UI', sans-serif;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background: radial-gradient(ellipse at 50% -10%, #241a12 0%, var(--bg) 55%, #050403 100%);
    color:var(--parchment);
    font-family:var(--font-body);
    overflow-x:hidden;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:24px 16px 60px;
    position:relative;
  }
  /* ambient candle flicker vignette */
  #app::before{
    content:"";
    position:fixed;top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,0.55) 100%);
    animation: flicker 6s infinite ease-in-out;
    z-index:1;
  }
  @keyframes flicker{
    0%,100%{opacity:0.9;}
    25%{opacity:1;}
    50%{opacity:0.85;}
    75%{opacity:0.97;}
  }
  @media (prefers-reduced-motion: reduce){
    #app::before{animation:none;}
  }
  .stage{
    position:relative;z-index:2;
    width:100%;max-width:880px;
  }
  h1,h2,h3{
    font-family:var(--font-display);
    font-weight:700;
    margin:0 0 8px 0;
    color:var(--gold-bright);
    text-shadow: 0 0 18px rgba(240,207,127,0.25), 0 2px 2px rgba(0,0,0,0.6);
  }
  h1{font-size:2.6rem;font-style:italic;letter-spacing:0.5px;}
  h2{font-size:1.7rem;font-style:italic;}
  h3{font-size:1.25rem;}
  .eyebrow{
    font-family:var(--font-label);
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:0.72rem;
    color:var(--gold);
    margin-bottom:10px;
    display:block;
  }
  p{line-height:1.6;color:var(--parchment);}
  .dim{color:var(--parchment-dim);}
  .frame{
    background: linear-gradient(160deg, var(--bg-3), var(--bg-2));
    border:1px solid var(--gold-dim);
    border-radius:var(--radius);
    padding:28px 30px;
    margin:18px 0;
    box-shadow: 0 0 0 1px rgba(201,162,77,0.08) inset, 0 18px 40px rgba(0,0,0,0.5);
    position:relative;
  }
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    width:22px;height:22px;
    border:2px solid var(--gold);
    opacity:0.55;
  }
  .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .center{text-align:center;}
  .btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
  button{
    font-family:var(--font-label);
    background:linear-gradient(160deg,var(--gold),var(--gold-dim));
    color:#20160a;
    border:none;
    padding:13px 26px;
    border-radius:3px;
    font-size:0.95rem;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:transform 0.15s, box-shadow 0.15s;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(201,162,77,0.35);}
  button:active{transform:translateY(0);}
  button:focus-visible{outline:3px solid var(--parchment);outline-offset:2px;}
  button.secondary{
    background:transparent;
    color:var(--parchment);
    border:1px solid var(--gold-dim);
  }
  button.secondary:hover{box-shadow:0 6px 16px rgba(0,0,0,0.4);}
  button:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .card-list{display:grid;gap:14px;margin-top:18px;}
  .choice-card{
    display:block;width:100%;text-align:left;
    background:var(--bg-3);
    border:1px solid var(--gold-dim);
    color:var(--parchment);
    padding:16px 18px;
    border-radius:4px;
    font-family:var(--font-body);
    font-size:1rem;
    cursor:pointer;
  }
  .choice-card:hover{border-color:var(--gold);background:#241b13;}
  .choice-card.correct{border-color:var(--success);background:#1c2b1d;}
  .choice-card.wrong{border-color:var(--danger);background:#2c1616;animation:shake 0.4s;}
  .choice-card.disabled{pointer-events:none;opacity:0.6;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .badge{
    display:inline-block;
    font-family:var(--font-label);
    font-size:0.72rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:20px;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    margin:2px 4px;
  }
  .map-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
    margin-top:22px;
  }
  .salon-door{
    border-radius:6px;
    padding:22px 16px;
    text-align:center;
    cursor:pointer;
    border:2px solid var(--gold-dim);
    background:linear-gradient(180deg, var(--bg-3), var(--bg-2));
    transition: transform 0.15s;
    position:relative;
  }
  .salon-door:hover{transform:translateY(-4px);}
  .salon-door.done{opacity:0.55;cursor:default;}
  .salon-door .glyph{font-size:2.1rem;display:block;margin-bottom:8px;}
  .salon-door .name{font-family:var(--font-display);font-style:italic;font-size:1.05rem;color:var(--gold-bright);}
  .salon-door .status{font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--parchment-dim);margin-top:6px;display:block;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    width:100%;max-width:880px;margin-bottom:6px;font-family:var(--font-label);
    font-size:0.8rem;color:var(--parchment-dim);letter-spacing:0.5px;
    flex-wrap:wrap;gap:8px;
  }
  .renown-track{display:flex;align-items:center;gap:8px;}
  .renown-dot{width:9px;height:9px;border-radius:50%;background:var(--gold-dim);}
  .renown-dot.lit{background:var(--gold-bright);box-shadow:0 0 8px var(--gold-bright);}
  .curtain{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(180deg,var(--wine),#2c0b10);
    z-index:50;display:flex;align-items:center;justify-content:center;
    transition:opacity 0.5s, visibility 0.5s;
  }
  .curtain.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .curtain span{font-family:var(--font-display);font-style:italic;font-size:1.6rem;color:var(--gold-bright);}
  .timerbar-wrap{width:100%;height:8px;background:var(--bg-3);border-radius:4px;overflow:hidden;margin:12px 0;border:1px solid var(--gold-dim);}
  .timerbar{height:100%;background:linear-gradient(90deg,var(--gold),var(--wine-light));transition:width 0.3s linear;}
  .lives{display:flex;gap:6px;font-size:1.1rem;}
  .fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  @media (max-width:560px){.fact-grid{grid-template-columns:1fr;}}
  .fact-tile{
    background:var(--bg-3);border:1px solid var(--gold-dim);border-radius:4px;
    padding:10px 12px;cursor:pointer;min-height:52px;display:flex;flex-direction:column;justify-content:center;
  }
  .fact-tile .flabel{font-family:var(--font-label);font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
  .fact-tile .fvalue{font-size:0.92rem;margin-top:2px;}
  .fact-tile.hidden-value .fvalue{filter:blur(4px);opacity:0.4;}
  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:560px){.match-cols{grid-template-columns:1fr;}}
  .match-tile{
    background:var(--bg-3);border:1px solid var(--gold-dim);color:var(--parchment);
    padding:12px 14px;border-radius:4px;margin-bottom:10px;cursor:pointer;font-size:0.92rem;
    text-align:left;width:100%;font-family:var(--font-body);
  }
  .match-tile:hover{border-color:var(--gold);}
  .match-tile.selected{border-color:var(--gold-bright);box-shadow:0 0 0 2px rgba(240,207,127,0.3);}
  .match-tile.locked{border-color:var(--success);background:#1c2b1d;opacity:0.75;cursor:default;pointer-events:none;}
  .match-tile.wrongflash{border-color:var(--danger);background:#2c1616;animation:shake 0.4s;}
  .footer-note{margin-top:26px;font-size:0.75rem;color:var(--parchment-dim);text-align:center;font-family:var(--font-label);letter-spacing:0.3px;}
  .pair-banner{
    background:var(--wine);color:var(--parchment);text-align:center;padding:10px;border-radius:4px;
    font-family:var(--font-label);letter-spacing:1px;font-size:0.8rem;margin-bottom:10px;text-transform:uppercase;
  }
  .pass-screen{text-align:center;padding:60px 20px;}
  .pass-screen .big{font-size:3rem;margin-bottom:14px;}
  .quiz-explain{background:#14100c;border-left:3px solid var(--gold);padding:10px 14px;margin-top:14px;border-radius:0 4px 4px 0;font-size:0.9rem;}
  .mode-card{
    background:var(--bg-3);border:1px solid var(--gold-dim);border-radius:6px;padding:20px;text-align:left;cursor:pointer;
    transition:transform 0.15s;
  }
  .mode-card:hover{transform:translateY(-3px);border-color:var(--gold);}
  .mode-card h3{margin-bottom:6px;}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  @media (max-width:600px){.mode-grid{grid-template-columns:1fr;}}
  .ending-title{font-size:2.2rem;}
  .accent-italian{border-color:var(--italian) !important;}
  .accent-spanish{border-color:var(--spanish) !important;}
  .accent-flemish{border-color:var(--flemish) !important;}
  .accent-dutch{border-color:var(--dutch) !important;}
  .accent-french{border-color:var(--french) !important;}
  input[type="text"]{
    font-family:var(--font-body);font-size:1rem;padding:10px 12px;border-radius:4px;border:1px solid var(--gold-dim);
    background:var(--bg-3);color:var(--parchment);width:100%;max-width:280px;
  }
  .hidden{display:none !important;}
  .small{font-size:0.85rem;}
  .link-btn{background:none;border:none;color:var(--gold);text-decoration:underline;font-family:var(--font-label);font-size:0.8rem;cursor:pointer;padding:6px;}
</style>
</head>

/* ============================================================
   STATE
   ============================================================ */
var state = null;
var SAVE_KEY = "baroqueMasqueradeSave_v1";

function freshState(mode){
  return {
    mode: mode,
    screen: "map",
    salonsCompleted: [],
    salonOrderChosen: [],
    renownCorrect: 0,
    renownTotal: 0,
    masks: [],
    choiceTags: [],
    currentSalon: null,
    currentWorkIdx: 0,
    currentMatchState: null,
    currentQuizQueue: [],
    quizIdx: 0,
    pairedTurn: "host",
    pairedScores: {host:0, guest:0},
    finaleQueue: [],
    finaleIdx: 0,
    finaleLives: 3,
    finaleCorrect: 0,
    startedAt: Date.now(),
    speedrunEndTime: mode === "speedrun" ? Date.now() + 12*60*1000 : null,
    gameOverByClock: false
  };
}

var speedrunInterval = null;
function startSpeedrunClock(){
  if(speedrunInterval) clearInterval(speedrunInterval);
  speedrunInterval = setInterval(function(){
    if(!state || state.mode !== "speedrun" || !state.speedrunEndTime) return;
    var remaining = state.speedrunEndTime - Date.now();
    if(remaining <= 0 && state.screen !== "ending"){
      state.gameOverByClock = true;
      clearInterval(speedrunInterval);
      state.screen = "ending";
      transition("The last candle burns out\u2026", renderScreen);
      return;
    }
    renderTopbar();
  }, 1000);
}
function stopSpeedrunClock(){
  if(speedrunInterval){ clearInterval(speedrunInterval); speedrunInterval = null; }
}

function saveGame(){
  if(state.mode !== "study") return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadGame(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ============================================================
   UTILITIES
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
function el(tag, opts){
  var e = document.createElement(tag);
  opts = opts || {};
  if(opts.cls) e.className = opts.cls;
  if(opts.text !== undefined) e.textContent = opts.text;
  if(opts.html !== undefined) e.innerHTML = opts.html;
  if(opts.attrs) for(var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  return e;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function sample(arr, n){
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}
function transition(text, cb){
  var curtain = $("#curtain");
  var curtainText = $("#curtainText");
  curtainText.textContent = text || "\u2026";
  curtain.classList.remove("hidden");
  setTimeout(function(){
    cb();
    setTimeout(function(){ curtain.classList.add("hidden"); }, 60);
  }, 420);
}
function renderTopbar(){
  var bar = $("#topbar");
  if(!state){ bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  var left = $("#topbarLeft");
  var modeLabel = state.mode === "speedrun" ? "Solo Speedrun" : state.mode === "paired" ? "Masquerade for Two" : "Study Salon";
  var timeStr = "";
  if(state.mode === "speedrun" && state.speedrunEndTime){
    var remaining = Math.max(0, state.speedrunEndTime - Date.now());
    var mins = Math.floor(remaining/60000);
    var secs = Math.floor((remaining%60000)/1000);
    timeStr = "  \u00b7  \u23F3 " + mins + ":" + (secs<10?"0":"")+secs;
  }
  left.textContent = modeLabel + " \u00b7 " + state.salonsCompleted.length + "/5 salons" + timeStr;
  var track = $("#renownTrack");
  track.innerHTML = "";
  var pct = state.renownTotal ? state.renownCorrect/state.renownTotal : 0;
  var lit = Math.round(pct*10);
  for(var i=0;i<10;i++){
    var dot = el("span",{cls:"renown-dot"+(i<lit?" lit":"")});
    track.appendChild(dot);
  }
}

function renderScreen(){
  renderTopbar();
  saveGame();
  switch(state.screen){
    case "map": renderMap(); break;
    case "salonIntro": renderSalonIntro(); break;
    case "match": renderMatch(); break;
    case "vocab": renderVocab(); break;
    case "quiz": renderQuiz(); break;
    case "salonComplete": renderSalonComplete(); break;
    case "finale": renderFinaleIntro(); break;
    case "finaleQuiz": renderFinaleQuiz(); break;
    case "ending": renderEnding(); break;
    case "passScreen": renderPassScreen(); break;

  }
}

  frame.appendChild(cols);
  var msg = el("p",{cls:"small dim", attrs:{id:"matchMsg"}, text:"\u00a0"});
  frame.appendChild(msg);

  stage.appendChild(frame);
  drawMatchColumns();
}

function drawMatchColumns(){
  var ms = state.currentMatchState;
  var cols = $("#matchCols");
  cols.innerHTML = "";
  var colA = el("div");
  var colB = el("div");
  ms.labels.forEach(function(item){
    var locked = ms.lockedIdx.indexOf(item.idx) !== -1;
    var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(ms.selectedLabel===item?" selected":""), text:item.text});
    if(!locked){
      tile.onclick = function(){
        ms.selectedLabel = item;
        tryMatch();
      };
    }
    colA.appendChild(tile);
  });
  ms.values.forEach(function(item){
    var locked = ms.lockedIdx.indexOf(item.idx) !== -1;
    var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(ms.selectedValue===item?" selected":""), text:item.text});
    if(!locked){
      tile.onclick = function(){
        ms.selectedValue = item;
        tryMatch();
      };
    }
    colB.appendChild(tile);
  });
  cols.appendChild(colA);
  cols.appendChild(colB);
}

function tryMatch(){
  var ms = state.currentMatchState;
  if(!ms.selectedLabel || !ms.selectedValue) { drawMatchColumns(); return; }
  if(ms.selectedLabel.idx === ms.selectedValue.idx){
    ms.lockedIdx.push(ms.selectedLabel.idx);
    ms.selectedLabel = null;
    ms.selectedValue = null;
    drawMatchColumns();
    if(ms.lockedIdx.length === ms.pairs.length){
      $("#matchMsg").textContent = "All matched \u2014 moving on\u2026";
      setTimeout(afterMatchComplete, 700);
    }
  } else {
    $("#matchMsg").textContent = "Not quite \u2014 try again.";
    var lbl = ms.selectedLabel, val = ms.selectedValue;
    ms.selectedLabel = null;
    ms.selectedValue = null;
    drawMatchColumns();
  }
}

function afterMatchComplete(){
  var salon = SALONS.filter(function(s){return s.id===state.currentSalon;})[0];
  var workId = salon.works[state.currentWorkIdx];
  var work = WORKS[workId];
  showFactsThenContinue(work, salon, function(){
    if(salon.vocabIntro.length && !state.vocabDoneForSalon){
      state.screen = "vocab";
      state.vocabDoneForSalon = true;
    } else {
      state.screen = "quiz";
      state.currentQuizQueue = sample(work.quiz, 3);
      state.quizIdx = 0;
      state.pendingQuizWork = work;
    }
    transition("Reading further\u2026", renderScreen);
  });
}

function showFactsThenContinue(work, salon, cb){
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame accent-"+salon.accent});
  frame.appendChild(el("span",{cls:"eyebrow", text: work.artist}));
  frame.appendChild(el("h2",{text: work.title}));
  frame.appendChild(el("p",{cls:"dim", text: work.date + " \u00b7 " + work.medium + " \u00b7 " + work.location}));
  frame.appendChild(el("h3",{text:"Form, Function, Content, Context"}));
  var list = el("div",{cls:"card-list"});
  work.facts.forEach(function(f){
    list.appendChild(el("div",{cls:"choice-card disabled", text: f}));
  });
  frame.appendChild(list);
  var btn = el("button",{text:"Continue"});
  btn.style.marginTop = "16px";
  btn.onclick = cb;
  frame.appendChild(btn);
  stage.appendChild(frame);
}

/* ============================================================
   VOCAB MINI-GAME
   ============================================================ */
function renderVocab(){
  var salon = SALONS.filter(function(s){return s.id===state.currentSalon;})[0];
  var workId = salon.works[state.currentWorkIdx];
  var work = WORKS[workId];
  var vocabKeys = salon.vocabIntro.filter(function(k){ return !state.masks.some ? true : true; });
  // Build vocab set: all vocabIntro terms for this salon not yet matched this visit
  if(!state.vocabRoundKeys){
    state.vocabRoundKeys = salon.vocabIntro.slice();
    state.vocabLocked = [];
  }
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame accent-"+salon.accent});
  frame.appendChild(el("span",{cls:"eyebrow", text:"Vocabulary of the Salon"}));
  frame.appendChild(el("h2",{text:"Match each term to its definition"}));

  var terms = shuffle(state.vocabRoundKeys.map(function(k){ return {key:k, text:VOCAB[k].term}; }));
  var defs = shuffle(state.vocabRoundKeys.map(function(k){ return {key:k, text:VOCAB[k].def}; }));

  var cols = el("div",{cls:"match-cols"});
  var colA = el("div"), colB = el("div");
  var selTerm = null, selDef = null;

  function redraw(){
    colA.innerHTML=""; colB.innerHTML="";
    terms.forEach(function(t){
      var locked = state.vocabLocked.indexOf(t.key) !== -1;
      var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(selTerm===t?" selected":""), text:t.text});
      if(!locked) tile.onclick = function(){ selTerm=t; check(); };
      colA.appendChild(tile);
    });
    defs.forEach(function(d){
      var locked = state.vocabLocked.indexOf(d.key) !== -1;
      var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(selDef===d?" selected":""), text:d.text});
      if(!locked) tile.onclick = function(){ selDef=d; check(); };
      colB.appendChild(tile);
    });
  }
  function check(){
    if(!selTerm || !selDef){ redraw(); return; }
    if(selTerm.key === selDef.key){
      state.vocabLocked.push(selTerm.key);
      selTerm=null; selDef=null;
      redraw();
      if(state.vocabLocked.length === state.vocabRoundKeys.length){
        setTimeout(function(){
          state.vocabRoundKeys = null;
          state.screen = "quiz";
          state.currentQuizQueue = sample(work.quiz, 3);
          state.quizIdx = 0;
          state.pendingQuizWork = work;
          transition("The terms settle into place\u2026", renderScreen);
        }, 650);
      }
    } else {
      selTerm=null; selDef=null;
      redraw();
    }
  }
  redraw();
  cols.appendChild(colA);
  cols.appendChild(colB);
  frame.appendChild(cols);
  stage.appendChild(frame);
}

/* ============================================================
   QUIZ (per-work, sampled)
   ============================================================ */
function renderQuiz(){
  var salon = SALONS.filter(function(s){return s.id===state.currentSalon;})[0];
  var work = state.pendingQuizWork;
  var q = state.currentQuizQueue[state.quizIdx];

  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame accent-"+salon.accent});
  frame.appendChild(el("span",{cls:"eyebrow", text: work.title + " \u00b7 Question " + (state.quizIdx+1) + " of " + state.currentQuizQueue.length}));
  frame.appendChild(el("h2",{text: q.q}));
  var list = el("div",{cls:"card-list"});
  var answered = false;
  var order = shuffle(q.choices.map(function(c,i){return {text:c, isAns:i===q.a};}));
  order.forEach(function(opt){
    var card = el("button",{cls:"choice-card", text:opt.text});
    card.onclick = function(){
      if(answered) return;
      answered = true;
      state.renownTotal++;
      Array.prototype.forEach.call(list.children, function(c){ c.classList.add("disabled"); });
      if(opt.isAns){
        card.classList.add("correct");
        state.renownCorrect++;
        if(state.mode==="paired") state.pairedScores[state.pairedTurn]++;
      } else {
        card.classList.add("wrong");
        Array.prototype.forEach.call(list.children, function(c2, i2){
          if(order[i2].isAns) c2.classList.add("correct");
        });
      }
      var explain = el("div",{cls:"quiz-explain", text:q.explain});
      frame.appendChild(explain);
      var nextBtn = el("button",{text: state.quizIdx+1 < state.currentQuizQueue.length ? "Next Question" : "Continue"});
      nextBtn.style.marginTop="14px";
      nextBtn.onclick = advanceQuiz;
      frame.appendChild(nextBtn);
      renderTopbar();
      saveGame();
    };
    list.appendChild(card);
  });
  frame.appendChild(list);
  stage.appendChild(frame);
}

function advanceQuiz(){
  var salon = SALONS.filter(function(s){return s.id===state.currentSalon;})[0];
  state.quizIdx++;
  if(state.quizIdx < state.currentQuizQueue.length){
    if(state.mode === "paired"){
      state.pairedTurn = state.pairedTurn === "host" ? "guest" : "host";
      state.screen = "passScreen";
      state.afterPass = "quiz";
      transition("Passing the mask\u2026", renderScreen);
    } else {
      transition("\u2026", renderScreen);
    }
    return;
  }
  // done with this work's quiz
  state.currentWorkIdx++;
  if(state.currentWorkIdx < salon.works.length){
    state.screen = "match";
    transition("The next canvas awaits\u2026", renderScreen);
  } else {
    state.screen = "salonComplete";
    transition("The salon quiets\u2026", renderScreen);
  }
}

/* ============================================================
   PASS SCREEN (paired mode)
   ============================================================ */
function renderPassScreen(){
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame pass-screen"});
  frame.appendChild(el("div",{cls:"big", text: state.pairedTurn === "host" ? "\uD83C\uDFAD" : "\uD83E\uDD3F"}));
  frame.appendChild(el("h2",{text: "Pass the device to the " + (state.pairedTurn === "host" ? "Host" : "Guest")}));
  frame.appendChild(el("p",{cls:"dim", text:"Different questions await \u2014 no peeking at each other's screens."}));
  var btn = el("button",{text:"I'm Ready"});
  btn.onclick = function(){
    state.screen = state.afterPass || "quiz";
    transition("\u2026", renderScreen);
  };
  frame.appendChild(btn);
  stage.appendChild(frame);
}

/* ============================================================
   SALON COMPLETE
   ============================================================ */
function renderSalonComplete(){
  var salon = SALONS.filter(function(s){return s.id===state.currentSalon;})[0];
  if(state.salonsCompleted.indexOf(salon.id) === -1){
    state.salonsCompleted.push(salon.id);
    state.masks.push(salon.id);
  }
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame center accent-"+salon.accent});
  frame.appendChild(el("span",{cls:"glyph", html:"<div style='font-size:2.6rem'>"+salon.glyph+"</div>"}));
  frame.appendChild(el("h2",{text: salon.name + " \u2014 Complete"}));
  frame.appendChild(el("p",{cls:"dim", text:"You've earned a mask for this salon. " + (5-state.salonsCompleted.length) + " salon(s) remain before midnight."}));
  var btn = el("button",{text:"Return to the Ballroom"});
  btn.onclick = function(){
    state.screen = "map";
    transition("Back among the crowd\u2026", renderScreen);
  };
  frame.appendChild(btn);
  stage.appendChild(frame);
}

/* ============================================================
   GRAND FINALE
   ============================================================ */
function renderFinaleIntro(){
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame center"});
  frame.appendChild(el("span",{cls:"eyebrow", text:"Midnight"}));
  frame.appendChild(el("h2",{text:"The Grand Unmasking"}));
  frame.appendChild(el("p",{text:"All five salons empty into the great hall. The questions come quickly now, drawn from everything you've seen tonight. You have three candles \u2014 lose them all, and the evening ends early."}));
  var btn = el("button",{text:"Begin the Finale"});
  btn.onclick = function(){
    var allQ = [];
    Object.keys(WORKS).forEach(function(wid){
      WORKS[wid].quiz.forEach(function(q){ allQ.push({q:q, work:WORKS[wid]}); });
    });
    state.finaleQueue = sample(allQ, 14);
    state.finaleIdx = 0;
    state.finaleLives = 3;
    state.finaleCorrect = 0;
    state.screen = "finaleQuiz";
    transition("The chandeliers dim\u2026", renderScreen);
  };
  frame.appendChild(btn);
  stage.appendChild(frame);
}

function renderFinaleQuiz(){
  if(state.finaleLives <= 0 || state.finaleIdx >= state.finaleQueue.length){
    state.screen = "ending";
    transition("The last candle goes out\u2026", renderScreen);
    return;
  }
  var item = state.finaleQueue[state.finaleIdx];
  var q = item.q;
  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame"});
  var topRow = el("div",{cls:"btn-row", attrs:{style:"justify-content:space-between;margin-top:0;"}});
  topRow.appendChild(el("span",{cls:"eyebrow", text:"Question " + (state.finaleIdx+1) + " of " + state.finaleQueue.length}));
  var livesEl = el("span",{cls:"lives"});
  for(var i=0;i<3;i++){ livesEl.appendChild(el("span",{text: i<state.finaleLives ? "\uD83D\uDD6F\uFE0F" : "\uD83D\uDCA8"})); }
  topRow.appendChild(livesEl);
  frame.appendChild(topRow);
  frame.appendChild(el("h2",{text:q.q}));
  frame.appendChild(el("p",{cls:"dim small", text:"From: " + item.work.title}));
  var list = el("div",{cls:"card-list"});
  var answered = false;
  var order = shuffle(q.choices.map(function(c,i){return {text:c, isAns:i===q.a};}));
  order.forEach(function(opt){
    var card = el("button",{cls:"choice-card", text:opt.text});
    card.onclick = function(){
      if(answered) return;
      answered = true;
      Array.prototype.forEach.call(list.children, function(c){ c.classList.add("disabled"); });
      if(opt.isAns){
        card.classList.add("correct");
        state.finaleCorrect++;
      } else {
        card.classList.add("wrong");
        state.finaleLives--;
        Array.prototype.forEach.call(list.children, function(c2,i2){ if(order[i2].isAns) c2.classList.add("correct"); });
      }
      var nextBtn = el("button",{text:"Next"});
      nextBtn.style.marginTop="14px";
      nextBtn.onclick = function(){
        state.finaleIdx++;
        transition("\u2026", renderScreen);
      };
      frame.appendChild(nextBtn);
    };
    list.appendChild(card);
  });
  frame.appendChild(list);
  stage.appendChild(frame);
}

/* ============================================================
   ENDING
   ============================================================ */
function renderEnding(){
  stopSpeedrunClock();
  clearSave();
  var pct = state.renownTotal ? (state.renownCorrect + state.finaleCorrect) / (state.renownTotal + state.finaleQueue.length) : 0;
  var tagCounts = {};
  state.choiceTags.forEach(function(t){ tagCounts[t] = (tagCounts[t]||0)+1; });
  var dominantTag = null, best = 0;
  for(var t in tagCounts){ if(tagCounts[t] > best){ best = tagCounts[t]; dominantTag = t; } }

  var candidates = ENDINGS.filter(function(e){ return pct >= e.min; });
  var tagMatch = candidates.filter(function(e){ return e.tag === dominantTag; });
  var chosen = tagMatch.length ? tagMatch[0] : candidates.filter(function(e){return e.tag===null;})[0] || ENDINGS[ENDINGS.length-1];

  var stage = $("#stage");
  stage.innerHTML = "";
  var frame = el("div",{cls:"frame center"});
  frame.appendChild(el("span",{cls:"eyebrow", text:"The masks come off"}));
  frame.appendChild(el("h2",{cls:"ending-title", text: chosen.title}));
  frame.appendChild(el("p",{text: chosen.desc}));
  frame.appendChild(el("p",{cls:"dim small", text: "Accuracy tonight: " + Math.round(pct*100) + "%  \u00b7  Masks earned: " + state.masks.length + "/5"}));
  if(state.gameOverByClock){
    frame.appendChild(el("p",{cls:"dim small", text:"(The clock ran out before the evening was through.)"}));
  }

  if(state.mode === "paired"){
    frame.appendChild(el("p",{cls:"dim small", text:"Host score: " + state.pairedScores.host + "  \u00b7  Guest score: " + state.pairedScores.guest}));
  }

  var btnRow = el("div",{cls:"btn-row"});
  var again = el("button",{text:"Attend Another Ball"});
  again.onclick = function(){ transition("Resetting the candles\u2026", renderTitle); };
  btnRow.appendChild(again);
  frame.appendChild(btnRow);
  stage.appendChild(frame);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("DOMContentLoaded", function(){
  renderTitle();
});
</script>
</body>
</html>
