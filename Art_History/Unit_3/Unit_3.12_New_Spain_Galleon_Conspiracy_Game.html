<style>

  *{box-sizing:border-box;}

    margin:0;padding:0;height:100%;
    background: radial-gradient(ellipse at 50% -10%, #1b2446 0%, var(--bg) 55%, #050710 100%);

    font-family:var(--font-body);
    overflow-x:hidden;
  }

    background: radial-gradient(ellipse at 50% 35%, transparent 25%, rgba(4,6,14,0.6) 100%);

    z-index:1;
  }

    0%,100%{opacity:0.92;}

  }

  h2{font-size:1.65rem;font-style:italic;}
  h3{font-size:1.2rem;}
  .eyebrow{font-family:var(--font-label);text-transform:uppercase;letter-spacing:3px;font-size:0.7rem;color:var(--amber);margin-bottom:10px;display:block;}
  p{line-height:1.6;color:var(--parchment);}
  .dim{color:var(--parchment-dim);}

  .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .center{text-align:center;}
  .btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
  button{

  .curtain span{font-family:var(--font-display);font-style:italic;font-size:1.5rem;color:var(--amber-bright);}

    background:var(--bg-3);border:1px solid var(--amber-dim);color:var(--parchment);padding:12px 14px;border-radius:4px;

  .match-tile.selected{border-color:var(--amber-bright);box-shadow:0 0 0 2px rgba(240,196,120,0.3);}
  .match-tile.locked{border-color:var(--success);background:#16281f;opacity:0.75;cursor:default;pointer-events:none;}
  .footer-note{margin-top:26px;font-size:0.75rem;color:var(--parchment-dim);text-align:center;font-family:var(--font-label);letter-spacing:0.3px;}

  .quiz-explain{background:#101627;border-left:3px solid var(--amber);padding:10px 14px;margin-top:14px;border-radius:0 4px 4px 0;font-size:0.9rem;}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  @media (max-width:600px){.mode-grid{grid-template-columns:1fr;}}

    display:inline-block;border:2px solid var(--amber);color:var(--amber-bright);border-radius:50%;
    width:64px;height:64px;line-height:60px;text-align:center;font-family:var(--font-display);font-style:italic;font-size:1.6rem;
    box-shadow:0 0 0 3px rgba(216,163,77,0.15);

  .hidden{display:none !important;}
  .small{font-size:0.85rem;}
  .evidence-tag{
    display:inline-block;background:var(--bg-3);border:1px dashed var(--pearl);color:var(--pearl-bright);
    font-family:var(--font-label);font-size:0.68rem;letter-spacing:1px;text-transform:uppercase;
    padding:4px 10px;border-radius:3px;margin:2px 4px 2px 0;
  }
</style>

var state = null;
var SAVE_KEY = "galleonConspiracySave_v1";

function freshState(mode){
  return {
    mode: mode,
    screen: "map",
    sitesCompleted: [],
    renownCorrect: 0,
    renownTotal: 0,
    seals: [],
    choiceTags: [],
    currentSite: null,
    currentWorkIdx: 0,
    currentMatchState: null,
    currentQuizQueue: [],
    quizIdx: 0,
    vocabRoundKeys: null,
    vocabLocked: [],
    vocabDoneForSite: false,
    pairedTurn: "inspector",
    pairedScores: {inspector:0, scribe:0},
    finaleQueue: [],
    finaleIdx: 0,
    finaleLives: 3,
    finaleCorrect: 0,
    startedAt: Date.now(),
    speedrunEndTime: mode === "speedrun" ? Date.now() + 10*60*1000 : null,
    gameOverByClock: false
  };
}

var speedrunInterval = null;
function startSpeedrunClock(){
  if(speedrunInterval) clearInterval(speedrunInterval);
  speedrunInterval = setInterval(function(){
    if(!state || state.mode !== "speedrun" || !state.speedrunEndTime) return;
    var remaining = state.speedrunEndTime - Date.now();
    if(remaining <= 0 && state.screen !== "ending"){
      state.gameOverByClock = true;
      clearInterval(speedrunInterval);
      state.screen = "ending";
      transition("The galleon's horn sounds\u2026", renderScreen);
      return;
    }
    renderTopbar();
  }, 1000);
}
function stopSpeedrunClock(){
  if(speedrunInterval){ clearInterval(speedrunInterval); speedrunInterval = null; }
}

function saveGame(){
  if(state.mode !== "study") return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadGame(){
  try{ var raw = localStorage.getItem(SAVE_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ============================================================
   UTILITIES
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
function el(tag, opts){
  var e = document.createElement(tag);
  opts = opts || {};
  if(opts.cls) e.className = opts.cls;
  if(opts.text !== undefined) e.textContent = opts.text;
  if(opts.html !== undefined) e.innerHTML = opts.html;
  if(opts.attrs) for(var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  return e;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function transition(text, cb){
  var curtain = $("#curtain");
  var curtainText = $("#curtainText");
  curtainText.textContent = text || "\u2026";
  curtain.classList.remove("hidden");
  setTimeout(function(){
    cb();
    setTimeout(function(){ curtain.classList.add("hidden"); }, 60);
  }, 420);
}
function renderTopbar(){
  var bar = $("#topbar");
  if(!state){ bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  var left = $("#topbarLeft");
  var modeLabel = state.mode === "speedrun" ? "The Night Watch" : state.mode === "paired" ? "Partners in the Field" : "The Archive";
  var timeStr = "";
  if(state.mode === "speedrun" && state.speedrunEndTime){
    var remaining = Math.max(0, state.speedrunEndTime - Date.now());
    var mins = Math.floor(remaining/60000);
    var secs = Math.floor((remaining%60000)/1000);
    timeStr = "  \u00b7  \u23F3 " + mins + ":" + (secs<10?"0":"")+secs + " to dawn";
  }
  left.textContent = modeLabel + " \u00b7 " + state.sitesCompleted.length + "/6 sites" + timeStr;
  var track = $("#track");
  track.innerHTML = "";
  var pct = state.renownTotal ? state.renownCorrect/state.renownTotal : 0;
  var lit = Math.round(pct*10);
  for(var i=0;i<10;i++){ track.appendChild(el("span",{cls:"track-dot"+(i<lit?" lit":"")})); }
}

/* ============================================================
   MATCH GAME (Evidence Log: label -> value pairing)
   ============================================================ */
function buildMatchPairs(work){
  return [
    {label:"Artist / Culture", value:work.artist},
    {label:"Title", value:work.title},
    {label:"Date", value:work.date},
    {label:"Medium", value:work.medium},
    {label:"Location", value:work.location}
  ];
}
function renderMatch(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  var workId = site.works[state.currentWorkIdx];
  var work = WORKS[workId];
  var pairs = buildMatchPairs(work);
  state.currentMatchState = {
    workId: workId,
    labels: shuffle(pairs.map(function(p,i){return {idx:i, text:p.label};})),
    values: shuffle(pairs.map(function(p,i){return {idx:i, text:p.value};})),
    selectedLabel: null, selectedValue: null, lockedIdx: [], pairs: pairs
  };
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame"});
  frame.appendChild(el("span",{cls:"eyebrow", text: site.name + " \u00b7 Evidence " + (state.currentWorkIdx+1) + " of " + site.works.length}));
  frame.appendChild(el("h2",{text:"Build the evidence log"}));
  frame.appendChild(el("p",{cls:"dim", text:"Click a label, then click the value that belongs with it."}));
  var cols = el("div",{cls:"match-cols", attrs:{id:"matchCols"}});
  frame.appendChild(cols);
  frame.appendChild(el("p",{cls:"small dim", attrs:{id:"matchMsg"}, text:"\u00a0"}));
  stage.appendChild(frame);
  drawMatchColumns();
}
function drawMatchColumns(){
  var ms = state.currentMatchState;
  var cols = $("#matchCols"); cols.innerHTML = "";
  var colA = el("div"), colB = el("div");
  ms.labels.forEach(function(item){
    var locked = ms.lockedIdx.indexOf(item.idx) !== -1;
    var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(ms.selectedLabel===item?" selected":""), text:item.text});
    if(!locked) tile.onclick = function(){ ms.selectedLabel = item; tryMatch(); };
    colA.appendChild(tile);
  });
  ms.values.forEach(function(item){
    var locked = ms.lockedIdx.indexOf(item.idx) !== -1;
    var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(ms.selectedValue===item?" selected":""), text:item.text});
    if(!locked) tile.onclick = function(){ ms.selectedValue = item; tryMatch(); };
    colB.appendChild(tile);
  });
  cols.appendChild(colA); cols.appendChild(colB);
}
function tryMatch(){
  var ms = state.currentMatchState;
  if(!ms.selectedLabel || !ms.selectedValue){ drawMatchColumns(); return; }
  if(ms.selectedLabel.idx === ms.selectedValue.idx){
    ms.lockedIdx.push(ms.selectedLabel.idx);
    ms.selectedLabel = null; ms.selectedValue = null;
    drawMatchColumns();
    if(ms.lockedIdx.length === ms.pairs.length){
      $("#matchMsg").textContent = "Evidence logged \u2014 moving on\u2026";
      setTimeout(afterMatchComplete, 700);
    }
  } else {
    $("#matchMsg").textContent = "Not quite \u2014 try again.";
    ms.selectedLabel = null; ms.selectedValue = null;
    drawMatchColumns();
  }
}
function afterMatchComplete(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  var workId = site.works[state.currentWorkIdx];
  var work = WORKS[workId];
  showFactsThenContinue(work, site, function(){
    if(site.vocabIntro.length && !state.vocabDoneForSite){
      state.screen = "vocab";
      state.vocabDoneForSite = true;
    } else {
      state.screen = "quiz";
      state.currentQuizQueue = sample(work.quiz, 3);
      state.quizIdx = 0;
      state.pendingQuizWork = work;
    }
    transition("Reading the case notes\u2026", renderScreen);
  });
}
function showFactsThenContinue(work, site, cb){
  var stage = $("#stage"); stage.innerHTML = "";

  var list = el("div",{cls:"card-list"});
  work.facts.forEach(function(f){ list.appendChild(el("div",{cls:"choice-card disabled", text: f})); });
  frame.appendChild(list);

function renderVocab(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  var workId = site.works[state.currentWorkIdx];
  var work = WORKS[workId];
  if(!state.vocabRoundKeys){ state.vocabRoundKeys = site.vocabIntro.slice(); state.vocabLocked = []; }
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame"});
  frame.appendChild(el("span",{cls:"eyebrow", text:"Vocabulary of the Case"}));
  frame.appendChild(el("h2",{text:"Match each term to its definition"}));
  var terms = shuffle(state.vocabRoundKeys.map(function(k){ return {key:k, text:VOCAB[k].term}; }));
  var defs = shuffle(state.vocabRoundKeys.map(function(k){ return {key:k, text:VOCAB[k].def}; }));
  var cols = el("div",{cls:"match-cols"});
  var colA = el("div"), colB = el("div");
  var selTerm = null, selDef = null;
  function redraw(){
    colA.innerHTML=""; colB.innerHTML="";
    terms.forEach(function(t){
      var locked = state.vocabLocked.indexOf(t.key) !== -1;
      var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(selTerm===t?" selected":""), text:t.text});
      if(!locked) tile.onclick = function(){ selTerm=t; check(); };
      colA.appendChild(tile);
    });
    defs.forEach(function(d){
      var locked = state.vocabLocked.indexOf(d.key) !== -1;
      var tile = el("button",{cls:"match-tile"+(locked?" locked":"")+(selDef===d?" selected":""), text:d.text});
      if(!locked) tile.onclick = function(){ selDef=d; check(); };
      colB.appendChild(tile);
    });
  }
  function check(){
    if(!selTerm || !selDef){ redraw(); return; }
    if(selTerm.key === selDef.key){
      state.vocabLocked.push(selTerm.key);
      selTerm=null; selDef=null;
      redraw();
      if(state.vocabLocked.length === state.vocabRoundKeys.length){
        setTimeout(function(){
          state.vocabRoundKeys = null;
          state.screen = "quiz";
          state.currentQuizQueue = sample(work.quiz, 3);
          state.quizIdx = 0;
          state.pendingQuizWork = work;
          transition("The terms go into the file\u2026", renderScreen);
        }, 650);
      }
    } else { selTerm=null; selDef=null; redraw(); }
  }
  redraw();
  cols.appendChild(colA); cols.appendChild(colB);
  frame.appendChild(cols);
  stage.appendChild(frame);
}

   QUIZ (Interrogation)
   ============================================================ */
function renderQuiz(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  var work = state.pendingQuizWork;
  var q = state.currentQuizQueue[state.quizIdx];
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame"});
  frame.appendChild(el("span",{cls:"eyebrow", text: work.title + " \u00b7 Question " + (state.quizIdx+1) + " of " + state.currentQuizQueue.length}));
  frame.appendChild(el("h2",{text: q.q}));
  var list = el("div",{cls:"card-list"});
  var answered = false;
  var order = shuffle(q.choices.map(function(c,i){return {text:c, isAns:i===q.a};}));
  order.forEach(function(opt){
    var card = el("button",{cls:"choice-card", text:opt.text});
    card.onclick = function(){
      if(answered) return;
      answered = true;
      state.renownTotal++;
      Array.prototype.forEach.call(list.children, function(c){ c.classList.add("disabled"); });
      if(opt.isAns){
        card.classList.add("correct");
        state.renownCorrect++;
        if(state.mode==="paired") state.pairedScores[state.pairedTurn]++;
      } else {
        card.classList.add("wrong");
        Array.prototype.forEach.call(list.children, function(c2,i2){ if(order[i2].isAns) c2.classList.add("correct"); });
      }
      frame.appendChild(el("div",{cls:"quiz-explain", text:q.explain}));
      var nextBtn = el("button",{text: state.quizIdx+1 < state.currentQuizQueue.length ? "Next Question" : "Continue"});
      nextBtn.style.marginTop="14px";
      nextBtn.onclick = advanceQuiz;
      frame.appendChild(nextBtn);
      renderTopbar();
      saveGame();
    };
    list.appendChild(card);
  });
  frame.appendChild(list);
  stage.appendChild(frame);
}
function advanceQuiz(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  state.quizIdx++;
  if(state.quizIdx < state.currentQuizQueue.length){
    if(state.mode === "paired"){
      state.pairedTurn = state.pairedTurn === "inspector" ? "scribe" : "inspector";
      state.screen = "passScreen";
      state.afterPass = "quiz";
      transition("Passing the notebook\u2026", renderScreen);
    } else {
      transition("\u2026", renderScreen);
    }
    return;
  }
  state.currentWorkIdx++;
  if(state.currentWorkIdx < site.works.length){
    state.screen = "match";
    transition("On to the next piece of evidence\u2026", renderScreen);
  } else {
    state.screen = "siteComplete";
    transition("The site falls quiet\u2026", renderScreen);
  }
}

/* ============================================================
   PASS SCREEN (paired mode)
   ============================================================ */
function renderPassScreen(){
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame pass-screen"});
  frame.appendChild(el("div",{cls:"big", text: state.pairedTurn === "inspector" ? "\uD83D\uDD75\uFE0F" : "\u270D\uFE0F"}));
  frame.appendChild(el("h2",{text: "Pass the notebook to the " + (state.pairedTurn === "inspector" ? "Inspector" : "Scribe")}));
  frame.appendChild(el("p",{cls:"dim", text:"Different questions await \u2014 no peeking at each other's screens."}));
  var btn = el("button",{text:"Ready"});
  btn.onclick = function(){ state.screen = state.afterPass || "quiz"; transition("\u2026", renderScreen); };
  frame.appendChild(btn);
  stage.appendChild(frame);
}

/* ============================================================
   SITE COMPLETE
   ============================================================ */
function renderSiteComplete(){
  var site = SITES.filter(function(s){return s.id===state.currentSite;})[0];
  if(state.sitesCompleted.indexOf(site.id) === -1){
    state.sitesCompleted.push(site.id);
    state.seals.push(site.id);
  }
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame center"});
  frame.appendChild(el("div",{html:"<span class='seal'>\u2713</span>", attrs:{style:"margin-bottom:14px;"}}));
  frame.appendChild(el("h2",{text: site.name + " \u2014 Case Filed"}));
  frame.appendChild(el("p",{cls:"dim", text: "This site's evidence is sealed into your report. " + (6-state.sitesCompleted.length) + " site(s) remain before the galleon sails."}));
  var btn = el("button",{text:"Return to the City Map"});
  btn.onclick = function(){ state.screen = "map"; transition("Back into the streets\u2026", renderScreen); };
  frame.appendChild(btn);
  stage.appendChild(frame);
}

/* ============================================================
   GRAND FINALE
   ============================================================ */
function renderFinaleIntro(){
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame center"});
  frame.appendChild(el("span",{cls:"eyebrow", text:"Dawn is close"}));
  frame.appendChild(el("h2",{text:"The Viceroy's Chamber"}));
  frame.appendChild(el("p",{text:"All six case files are spread across the table. Now you must defend your full report, question by question, before the Real Audiencia decides whether the galleon sails. You have three witnesses to your credibility \u2014 lose them all, and the hearing ends early."}));
  var btn = el("button",{text:"Present Your Report"});
  btn.onclick = function(){
    var allQ = [];
    Object.keys(WORKS).forEach(function(wid){ WORKS[wid].quiz.forEach(function(q){ allQ.push({q:q, work:WORKS[wid]}); }); });
    state.finaleQueue = sample(allQ, 14);
    state.finaleIdx = 0; state.finaleLives = 3; state.finaleCorrect = 0;
    state.screen = "finaleQuiz";
    transition("The Audiencia falls silent\u2026", renderScreen);
  };
  frame.appendChild(btn);
  stage.appendChild(frame);
}
function renderFinaleQuiz(){
  if(state.finaleLives <= 0 || state.finaleIdx >= state.finaleQueue.length){
    state.screen = "ending";
    transition("The hearing concludes\u2026", renderScreen);
    return;
  }
  var item = state.finaleQueue[state.finaleIdx];
  var q = item.q;
  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame"});
  var topRow = el("div",{cls:"btn-row", attrs:{style:"justify-content:space-between;margin-top:0;"}});
  topRow.appendChild(el("span",{cls:"eyebrow", text:"Question " + (state.finaleIdx+1) + " of " + state.finaleQueue.length}));
  var livesEl = el("span",{cls:"lives"});
  for(var i=0;i<3;i++){ livesEl.appendChild(el("span",{text: i<state.finaleLives ? "\uD83D\uDD6F\uFE0F" : "\uD83D\uDCA8"})); }
  topRow.appendChild(livesEl);
  frame.appendChild(topRow);
  frame.appendChild(el("h2",{text:q.q}));
  frame.appendChild(el("p",{cls:"dim small", text:"From: " + item.work.title}));
  var list = el("div",{cls:"card-list"});
  var answered = false;
  var order = shuffle(q.choices.map(function(c,i){return {text:c, isAns:i===q.a};}));
  order.forEach(function(opt){
    var card = el("button",{cls:"choice-card", text:opt.text});
    card.onclick = function(){
      if(answered) return;
      answered = true;
      Array.prototype.forEach.call(list.children, function(c){ c.classList.add("disabled"); });
      if(opt.isAns){ card.classList.add("correct"); state.finaleCorrect++; }
      else {
        card.classList.add("wrong"); state.finaleLives--;
        Array.prototype.forEach.call(list.children, function(c2,i2){ if(order[i2].isAns) c2.classList.add("correct"); });
      }
      var nextBtn = el("button",{text:"Next"});
      nextBtn.style.marginTop="14px";
      nextBtn.onclick = function(){ state.finaleIdx++; transition("\u2026", renderScreen); };
      frame.appendChild(nextBtn);
    };
    list.appendChild(card);
  });
  frame.appendChild(list);
  stage.appendChild(frame);
}

/* ============================================================
   ENDING
   ============================================================ */
function renderEnding(){
  stopSpeedrunClock();
  clearSave();
  var pct = state.renownTotal ? (state.renownCorrect + state.finaleCorrect) / (state.renownTotal + state.finaleQueue.length) : 0;
  var tagCounts = {};
  state.choiceTags.forEach(function(t){ tagCounts[t] = (tagCounts[t]||0)+1; });
  var dominantTag = null, best = 0;
  for(var t in tagCounts){ if(tagCounts[t] > best){ best = tagCounts[t]; dominantTag = t; } }
  var candidates = ENDINGS.filter(function(e){ return pct >= e.min; });
  var tagMatch = candidates.filter(function(e){ return e.tag === dominantTag; });
  var chosen = tagMatch.length ? tagMatch[0] : (candidates.filter(function(e){return e.tag===null;})[0] || ENDINGS[ENDINGS.length-1]);

  var stage = $("#stage"); stage.innerHTML = "";
  var frame = el("div",{cls:"frame center"});
  frame.appendChild(el("span",{cls:"eyebrow", text:"The report is closed"}));
  frame.appendChild(el("h2",{cls:"ending-title", text: chosen.title}));
  frame.appendChild(el("p",{text: chosen.desc}));
  frame.appendChild(el("p",{cls:"dim small", text: "Accuracy tonight: " + Math.round(pct*100) + "%  \u00b7  Sites sealed: " + state.seals.length + "/6"}));
  if(state.gameOverByClock){ frame.appendChild(el("p",{cls:"dim small", text:"(Dawn broke before the investigation was through.)"})); }
  if(state.mode === "paired"){ frame.appendChild(el("p",{cls:"dim small", text:"Inspector score: " + state.pairedScores.inspector + "  \u00b7  Scribe score: " + state.pairedScores.scribe})); }
  var btnRow = el("div",{cls:"btn-row"});
  var again = el("button",{text:"Open a New Case"});
  again.onclick = function(){ transition("Filing the report away\u2026", renderTitle); };
  btnRow.appendChild(again);
  frame.appendChild(btnRow);
  stage.appendChild(frame);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener("DOMContentLoaded", function(){
  renderTitle();
});
</script>
</body>
