<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Lux Nova: The Cathedral Builders' Guild</title>
<style>
  :root{
    --stone-950:#12141c;
    --stone-900:#1a1e2b;
    --stone-800:#242a3c;
    --stone-700:#323a52;
    --stone-600:#4a5478;
    --stone-500:#6b7699;
    --parchment:#f2e8d5;
    --parchment-dim:#d9cba8;
    --gold:#d4af37;
    --gold-bright:#f0c94a;
    --ruby:#a4243b;
    --ruby-bright:#d13b56;
    --cobalt:#1e4d9b;
    --cobalt-bright:#2f6fd6;
    --emerald:#1c6e5c;
    --emerald-bright:#2a9d80;
    --amethyst:#5b3a8e;
    --good:#3fbf7f;
    --bad:#e0555f;
    --radius:14px;
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Georgia,'Palatino Linotype','Book Antiqua',serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(212,175,55,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(163,36,59,0.08), transparent 45%),
      linear-gradient(180deg, var(--stone-950), var(--stone-900) 60%, var(--stone-950));
    color:var(--parchment);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  h1,h2,h3{font-family:'Trajan Pro',Georgia,'Palatino Linotype',serif;letter-spacing:0.5px;margin:0 0 8px;}
  h1{font-size:1.9rem;color:var(--gold-bright);}
  h2{font-size:1.4rem;color:var(--gold);}
  h3{font-size:1.1rem;color:var(--parchment);}
  p{line-height:1.55;color:var(--parchment-dim);}
  .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#251c05;font-weight:700;border:none;border-radius:10px;
    padding:13px 22px;font-size:1rem;box-shadow:0 4px 14px rgba(212,175,55,0.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,175,55,0.45);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{
    background:linear-gradient(180deg,var(--stone-700),var(--stone-800));
    color:var(--parchment);box-shadow:none;border:1px solid var(--stone-600);
  }
  .btn.ghost{background:transparent;border:1px solid var(--stone-600);color:var(--parchment-dim);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .card{
    background:linear-gradient(180deg, var(--stone-800), var(--stone-900));
    border:1px solid var(--stone-700);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
  }
  .arch-frame{
    position:relative;
    border-top-left-radius:90px;border-top-right-radius:90px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg, rgba(212,175,55,0.06), transparent 40%), var(--stone-900);
    padding:26px 24px;
  }
  .center{text-align:center;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row.center{justify-content:center;}
  .row.between{justify-content:space-between;align-items:center;}
  .pill{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.75rem;
    background:var(--stone-700);color:var(--parchment-dim);font-family:system-ui,sans-serif;letter-spacing:.4px;
  }
  .pill.gold{background:rgba(212,175,55,0.18);color:var(--gold-bright);border:1px solid var(--gold);}
  .pill.good{background:rgba(63,191,127,0.15);color:var(--good);border:1px solid var(--good);}
  .pill.bad{background:rgba(224,85,95,0.15);color:var(--bad);border:1px solid var(--bad);}
  .hud{
    position:sticky;top:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(18,20,28,0.92);backdrop-filter:blur(4px);
    border:1px solid var(--stone-700);border-radius:12px;
    padding:9px 16px;margin-bottom:16px;font-family:system-ui,sans-serif;font-size:0.85rem;
    gap:10px;flex-wrap:wrap;
  }
  .hud .stat{color:var(--parchment-dim);}
  .hud .stat b{color:var(--gold-bright);}
  .stone-divider{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0;opacity:.5;}
  .fade-in{animation:fadeIn .4s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulseGood{0%{box-shadow:0 0 0 0 rgba(63,191,127,0.6);}70%{box-shadow:0 0 0 14px rgba(63,191,127,0);}100%{box-shadow:0 0 0 0 rgba(63,191,127,0);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .shake{animation:shake .3s ease;}
  .pulse-good{animation:pulseGood .8s ease;}

  /* Mode / journey cards */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--stone-800);border:1px solid var(--stone-700);border-radius:var(--radius);
    padding:18px;cursor:pointer;transition:.15s;text-align:left;
  }
  .mode-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .mode-card .icon{font-size:1.8rem;}

  .journey-map{display:flex;flex-direction:column;gap:10px;}
  .journey-node{
    display:flex;align-items:center;gap:14px;background:var(--stone-800);
    border:1px solid var(--stone-700);border-radius:12px;padding:14px 16px;cursor:pointer;
    transition:.15s;position:relative;
  }
  .journey-node:hover{border-color:var(--gold);}
  .journey-node.locked{opacity:.45;cursor:not-allowed;}
  .journey-node.done{border-color:var(--good);}
  .journey-node .num{
    width:38px;height:38px;border-radius:50%;background:var(--stone-700);color:var(--parchment);
    display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:system-ui,sans-serif;
  }
  .journey-node.done .num{background:var(--good);color:#0a1e14;}
  .journey-node .info{flex:1;}
  .journey-node .info .place{font-size:0.72rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;font-family:system-ui,sans-serif;}
  .journey-connector{width:2px;height:14px;background:var(--stone-600);margin-left:33px;}

  /* Hotspot builder */
  .hotspot-wrap{position:relative;width:100%;max-width:680px;margin:0 auto;}
  .hotspot-wrap svg{width:100%;display:block;}
  .hotspot{cursor:pointer;transition:.15s;}
  .hotspot circle{fill:rgba(212,175,55,0.35);stroke:var(--gold);stroke-width:2;}
  .hotspot:hover circle{fill:rgba(212,175,55,0.6);}
  .hotspot.correct circle{fill:rgba(63,191,127,0.55);stroke:var(--good);}
  .hotspot.wrong circle{fill:rgba(224,85,95,0.6);stroke:var(--bad);}
  .hotspot text{fill:var(--stone-950);font-size:13px;font-weight:700;font-family:system-ui,sans-serif;pointer-events:none;}
  .term-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;}
  .term-chip{
    background:var(--stone-700);color:var(--parchment);border:1px solid var(--stone-600);
    border-radius:8px;padding:8px 14px;font-size:0.9rem;font-family:system-ui,sans-serif;
  }
  .term-chip.selected{background:var(--gold);color:#251c05;border-color:var(--gold-bright);font-weight:700;}
  .term-chip.used{opacity:.25;text-decoration:line-through;pointer-events:none;}
  .def-callout{
    background:rgba(212,175,55,0.08);border:1px solid var(--gold);border-radius:10px;
    padding:12px 14px;margin-top:12px;font-size:0.92rem;color:var(--parchment);min-height:20px;
  }
  .progress-bar-outer{height:10px;background:var(--stone-700);border-radius:6px;overflow:hidden;margin-top:6px;}
  .progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .3s ease;}

  /* Quiz */
  .quiz-choice{
    display:block;width:100%;text-align:left;background:var(--stone-800);border:1px solid var(--stone-600);
    color:var(--parchment);border-radius:10px;padding:13px 16px;margin-bottom:10px;font-size:0.98rem;
    font-family:system-ui,sans-serif;transition:.12s;
  }
  .quiz-choice:hover{border-color:var(--gold);background:var(--stone-700);}
  .quiz-choice.correct{background:rgba(63,191,127,0.18);border-color:var(--good);}
  .quiz-choice.wrong{background:rgba(224,85,95,0.18);border-color:var(--bad);}
  .quiz-choice:disabled{cursor:default;}
  .quiz-progress{display:flex;gap:5px;margin-bottom:14px;}
  .quiz-progress .dot{flex:1;height:6px;border-radius:3px;background:var(--stone-700);}
  .quiz-progress .dot.answered-correct{background:var(--good);}
  .quiz-progress .dot.answered-wrong{background:var(--bad);}
  .quiz-progress .dot.current{background:var(--gold);}

  /* Sort game */
  .sort-zone{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  @media(max-width:600px){.sort-zone{grid-template-columns:1fr;}}
  .sort-bin{
    min-height:220px;border:2px dashed var(--stone-600);border-radius:12px;padding:12px;
    background:rgba(255,255,255,0.02);
  }
  .sort-bin.romanesque{border-color:var(--stone-600);}
  .sort-bin.gothic{border-color:var(--gold);}
  .sort-bin h4{margin:0 0 10px;font-family:system-ui,sans-serif;text-align:center;letter-spacing:1px;font-size:0.85rem;text-transform:uppercase;}
  .sort-card-stack{display:flex;flex-direction:column;gap:8px;}
  .sort-card{
    background:var(--stone-800);border:1px solid var(--stone-600);border-radius:8px;padding:10px 12px;
    font-size:0.9rem;font-family:system-ui,sans-serif;
  }

  /* Flashcards (study hall) */
  .flip-card{
    width:100%;max-width:520px;margin:14px auto;height:220px;position:relative;cursor:pointer;
    perspective:1000px;
  }
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
    border:1px solid var(--gold);font-family:system-ui,sans-serif;
  }
  .flip-front{background:linear-gradient(160deg,var(--stone-800),var(--stone-900));font-size:1.5rem;color:var(--gold-bright);font-weight:700;}
  .flip-back{background:linear-gradient(160deg,var(--cobalt),var(--stone-900));transform:rotateY(180deg);font-size:1.02rem;color:var(--parchment);}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;}
  .filter-chip{
    background:var(--stone-800);border:1px solid var(--stone-600);color:var(--parchment-dim);
    border-radius:20px;padding:6px 14px;font-size:0.8rem;font-family:system-ui,sans-serif;
  }
  .filter-chip.active{background:var(--gold);color:#251c05;border-color:var(--gold-bright);font-weight:700;}

  .timer-badge{
    font-family:system-ui,sans-serif;font-weight:700;font-size:1.1rem;color:var(--ruby-bright);
  }
  .timer-badge.low{color:var(--bad);animation:pulseGood 1s infinite;}

  .narrative-box{
    background:rgba(0,0,0,0.2);border-left:3px solid var(--gold);padding:14px 18px;border-radius:6px;
    font-style:italic;color:var(--parchment-dim);margin-bottom:16px;
  }
  .glossary-list{max-height:420px;overflow-y:auto;padding-right:6px;}
  .glossary-item{border-bottom:1px solid var(--stone-700);padding:10px 0;font-family:system-ui,sans-serif;}
  .glossary-item b{color:var(--gold-bright);}
  .glossary-item span{color:var(--parchment-dim);font-size:0.9rem;}

  .breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--stone-700);font-family:system-ui,sans-serif;font-size:0.92rem;}
  .rank-badge{
    display:inline-block;padding:8px 18px;border-radius:30px;font-weight:700;font-family:system-ui,sans-serif;
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));color:#251c05;
  }
  a.link-btn{text-decoration:none;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--stone-600);border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   LUX NOVA: THE CATHEDRAL BUILDERS' GUILD
   AP Art History — Unit 3.5 Gothic Review Game
   ============================================================ */

/* ---------- UTILITIES ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }

const STORAGE_KEY = 'luxnova_progress_v1';
function loadSave(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function writeSave(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}
function getSave(){
  let s = loadSave();
  if(!s){
    s = { completedChapters: {}, highScores: {}, guildRank: 'Novice Apprentice', totalStarsEver:0 };
    writeSave(s);
  }
  return s;
}
function updateSave(mutator){
  const s = getSave();
  mutator(s);
  writeSave(s);
  return s;
}

/* ============================================================
   CONTENT DATA — pulled from AH Unit 3.5 Gothic materials
   ============================================================ */

// --- Interior Cutaway hotspots (12 core architecture terms) ---
const CUTAWAY = [
  {id:'pinnacle', term:'Pinnacle', x:865, y:470, r:26,
    def:"A pointed ornament crowning a pier or buttress. Its weight helps drive the flying buttress's thrust safely down into the ground (think of it as the cathedral's stone 'party hat')."},
  {id:'flyingbuttress', term:'Flying Buttress', x:790, y:330, r:30,
    def:"A stone arch and pier reaching from an outer pillar to the upper wall, catching the outward thrust of the vault and channeling it to the ground — also resists wind-shear. Chartres was the first to use this system so extensively."},
  {id:'vaultingweb', term:'Vaulting Web', x:430, y:135, r:26,
    def:"The thin stone panels that fill the spaces between the ribs of a vault, forming the actual ceiling surface between the ribs."},
  {id:'diagonalribs', term:'Diagonal Ribs', x:520, y:112, r:24,
    def:"Ribs that cross a vault bay on the diagonal, forming the X-shaped stone skeleton of a rib vault — you can see the pointed arch in three dimensions where they meet."},
  {id:'transverserib', term:'Transverse Rib', x:500, y:88, r:22,
    def:"A rib running straight across the nave, marking the boundary between one bay and the next."},
  {id:'springing', term:'Springing', x:328, y:203, r:22,
    def:"The point where an arch or vault rib begins to curve upward from its supporting pier — this is where the wall 'becomes' the vault."},
  {id:'clerestory', term:'Clerestory', x:560, y:270, r:28,
    def:"The upper level of the nave wall, pierced with windows that rise above the aisle roofs to flood the nave with colored light — this is Suger's Lux Nova in action."},
  {id:'oculus', term:'Oculus', x:500, y:206, r:16,
    def:"A small round window or opening, often set within tracery or a gable, letting in an extra beam of light."},
  {id:'lancet', term:'Lancet', x:420, y:280, r:22,
    def:"A tall, narrow window topped with a pointed arch, almost always filled with stained glass."},
  {id:'triforium', term:'Triforium', x:560, y:392, r:26,
    def:"A narrow gallery or arcaded passage between the nave arcade below and the clerestory above — a decorative 'in-between' story."},
  {id:'navearcade', term:'Nave Arcade', x:520, y:522, r:28,
    def:"The row of arches carried on piers that separates the nave from the side aisles at ground level — the level worshippers actually walked through."},
  {id:'compoundpier', term:'Compound Pier with Responds', x:322, y:520, r:26,
    def:"A pier built from a cluster of attached shafts (responds) that visually continue upward, unbroken, into the ribs of the vault above — the eye is pulled straight to heaven."}
];

// --- Façade / exterior & plan-view hotspots (10 more terms) ---
const FACADE = [
  {id:'rosewindow', term:'Rose Window', x:500, y:330, r:34,
    def:"A circular window filled with stained glass, placed at the end of a transept or on a church's façade. Chartres has three: West, North, and South."},
  {id:'tracery', term:'Tracery', x:500, y:330, r:16,
    def:"The ornamental stonework that holds the stained glass in place within a window — the 'skeleton' inside the rose or lancet."},
  {id:'spire', term:'Spire / Steeple', x:222, y:118, r:24,
    def:"A tall, pointed tower rising from a church, often marking the crossing or the west front — one more way Gothic architecture reaches toward heaven."},
  {id:'trefoil', term:'Trefoil', x:500, y:452, r:16,
    def:"A three-lobed ornamental motif resembling a three-leafed plant — common in Gothic tracery, carving, and window openings."},
  {id:'narthex', term:'Narthex', x:500, y:610, r:24,
    def:"An entrance vestibule or lobby at the west end of a church — the space you pass through before entering the nave proper."},
  {id:'stringcourse', term:'Stringcourse', x:500, y:486, r:14,
    def:"A raised horizontal band of stone that runs across a building's façade, visually dividing it into levels."},
  {id:'archivolt', term:'Archivolt', x:500, y:552, r:18,
    def:"A series of concentric decorative moldings that frame an arch, especially over a portal doorway."},
  {id:'jamb', term:'Jamb', x:432, y:598, r:16,
    def:"The vertical side post of a doorway or portal — at Chartres, the Royal Portal jambs are covered in rows of elongated carved figures."},
  {id:'transept', term:'Transept', x:128, y:612, r:20,
    def:"The aisle that crosses the nave at a right angle, giving the church its cross-shaped (cruciform) plan. This is where the North and South Rose Windows sit at Chartres."},
  {id:'bay', term:'Bay', x:96, y:660, r:14,
    def:"A single vertical unit of a church's structure, defined by a set of piers/columns and repeated down the length of the nave — like a repeating module."}
];

// --- Full glossary (Study Hall) — combines above + the 4 non-architecture works ---
const GLOSSARY = [
  ...CUTAWAY.map(h=>({term:h.term, def:h.def, cat:'Architecture: Structure'})),
  ...FACADE.map(h=>({term:h.term, def:h.def, cat:'Architecture: Façade & Décor'})),
  {term:'Cathedral', def:"A church that houses the cathedra (Latin for 'seat'), the throne of a bishop — making it the principal church of a diocese.", cat:'Architecture: Structure'},
  {term:'Rib Vault', def:"A vault in which diagonal ribs form a web-like skeleton that partially carries the weight of the stone ceiling, first perfected at the end of the Romanesque period.", cat:'Architecture: Structure'},
  {term:'Moralized Bible (Bible Moralisée)', def:"An illuminated manuscript that pairs Old and New Testament stories side by side with commentary, teaching moral lessons through parallel imagery.", cat:'Other Gothic Works'},
  {term:'Pietà', def:"A painting or sculpture showing the dead body of Christ lying across the lap of a grieving Virgin Mary.", cat:'Other Gothic Works'},
  {term:'Haggadah', def:"A Jewish text — the word means 'narration' — that fulfills the obligation to retell the story of the Exodus from Egypt during Passover.", cat:'Other Gothic Works'},
  {term:'Passover', def:"An eight-day Jewish festival commemorating the Exodus from Egypt, named for the angel of death 'passing over' homes marked with lamb's blood.", cat:'Other Gothic Works'}
];

// --- Romanesque vs. Gothic sorting bank ---
const SORT_ITEMS = [
  {text:"Massive, drum-like columns", answer:'romanesque'},
  {text:"Thick walls with small windows and dark interiors", answer:'romanesque'},
  {text:"Round arches", answer:'romanesque'},
  {text:"Columns feel like fortress walls holding up the roof", answer:'romanesque'},
  {text:"Pointed arches that relieve thrust on other structural elements", answer:'gothic'},
  {text:"Flying buttresses carry the roof's outward force to piers outside the building", answer:'gothic'},
  {text:"Slender columns that continue upward, becoming part of the vault ribs", answer:'gothic'},
  {text:"Large stained-glass windows flood the nave with colored light", answer:'gothic'},
  {text:"Rib vaults meeting overhead in a pointed, web-like pattern", answer:'gothic'},
  {text:"The pointed arch was likely borrowed from Islamic architecture seen in Spain", answer:'gothic'},
  {text:"Abbot Suger's belief that 'the presence of light = the presence of God' drove this style's windows", answer:'gothic'},
  {text:"Named 'Gothic' as an insult by Giorgio Vasari, comparing it to a 'barbaric' tribe", answer:'gothic'},
  {text:"Interior feels cave-like and heavy", answer:'romanesque'},
  {text:"Rose windows and soaring, overwhelming interior spaces", answer:'gothic'}
];

// --- Historical background quiz bank ---
const HISTORY_BANK = [
  q("Who coined the term 'Gothic' as an insult in the 16th century?", ["Giorgio Vasari","Abbot Suger","Giotto di Bondone","Pseudo-Dionysius"], 0,
    "Giorgio Vasari compared the style to the Goths — a 'barbaric' tribe not known for great architecture."),
  q("The word 'Gothic' originally insulted the style by comparing it to which group?", ["The Vikings","The Goths","The Romans","The Moors"], 1,
    "The Goths (5th–8th century) were seen as a barbaric tribe with no great architectural achievements."),
  q("Which abbot championed the idea that architectural light reveals God's presence?", ["Abbot Suger of St. Denis","Enrico Scrovegni","Pope Boniface VIII","Louis IX"], 0,
    "Abbot Suger of St. Denis pushed for churches filled with light, inspired by Pseudo-Dionysius."),
  q("Suger's light-filled philosophy was drawn from the writings of...", ["Aristotle","Pseudo-Dionysius","Augustine","Vasari"], 1,

  const header = el(`

  const map = el(`<div class="fade-in"><div class="card">

    <p class="sans" style="font-size:0.9rem;">Travel from Chartres to Paris, the Rhineland, Padua, and back — mastering every element of Gothic art along the way. Complete a stop to unlock the next; ★ marks stops you've already mastered on this device.</p>

    <div class="journey-map" id="journeyList"></div>
  </div></div>`);
  app.appendChild(map);

  const list = document.getElementById('journeyList');
  state.chapterOrder.forEach((cid, idx)=>{
    const meta = CHAPTER_META[cid];
    const done = save.completedChapters[cid];
    const prevDone = idx===0 ? true : save.completedChapters[state.chapterOrder[idx-1]];
    const locked = !prevDone && !done && cid!=='boss' ? false : false; // allow free navigation but flag recommendation
    const isBoss = cid==='boss';
    const bossLocked = isBoss && !state.chapterOrder.slice(0,-1).every(c=>save.completedChapters[c]);
    const node = el(`
      <div class="journey-node ${bossLocked?'locked':''} ${done?'done':''}" data-cid="${cid}">
        <div class="num">${done? '★' : (idx+1)}</div>
        <div class="info">
          <div class="place sans">${meta.place}</div>
          <div style="font-weight:700;">${meta.icon} ${meta.title}</div>
        </div>
        <div class="pill ${done?'good':'gold'}">${bossLocked ? 'Locked — finish the journey first' : (done ? 'Mastered' : 'Enter')}</div>
      </div>
    `);
    if(!bossLocked){
      node.onclick = ()=> startChapter(cid);
    }
    list.appendChild(node);
    if(idx < state.chapterOrder.length-1){
      list.appendChild(el(`<div class="journey-connector"></div>`));
    }
  });
}

function startChapter(cid){
  state.currentChapter = cid;
  const meta = CHAPTER_META[cid];
  if(meta.type==='sort') renderSortChapter(cid);
  else if(meta.type==='hotspot') renderHotspotChapter(cid);
  else if(meta.type==='quiz') renderQuizChapter(cid);
  else if(meta.type==='boss') renderBossChapter(cid);
}

function chapterComplete(cid, correct, total){
  state.chapterResults[cid] = {correct, total};
  updateSave(s=>{
    s.completedChapters[cid] = true;
    const pct = Math.round((correct/total)*100);
    if(!s.highScores[cid] || pct > s.highScores[cid]) s.highScores[cid] = pct;
    s.totalStarsEver = (s.totalStarsEver||0) + 1;
  });
}

function renderHud(extraRight){
  return `<div class="hud">
    <div class="stat sans">Score: <b id="hudScore">${state.score}</b></div>
    <div class="stat sans">Streak: <b id="hudStreak">${state.streak}</b> 🔥 (best ${state.bestStreak})</div>
    ${extraRight || '<button class="btn ghost sans" id="backToMap" style="padding:7px 12px;font-size:0.8rem;">← Guild Map</button>'}
  </div>`;
}
function wireBackToMap(){
  const b = document.getElementById('backToMap');
  if(b) b.onclick = renderJourneyMap;
}

function bumpScore(correct){
  if(correct){
    state.score += 10 + Math.min(state.streak*2, 20);
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  } else {
    state.streak = 0;
  }
  const sEl = document.getElementById('hudScore');
  const stEl = document.getElementById('hudStreak');
  if(sEl) sEl.textContent = state.score;
  if(stEl) stEl.textContent = state.streak;
}

   CHAPTER 0: ROMANESQUE VS GOTHIC SORT
   ============================================================ */
function renderSortChapter(cid){
  app.innerHTML='';
  app.appendChild(el(renderHud()));
  wireBackToMap();

  const items = sample(SORT_ITEMS, SORT_ITEMS.length); // full set, shuffled order each time
  let idx = 0;
  let correctCount = 0;

  const wrap = el(`<div class="fade-in card">
    <h2>⛈ The Gathering Storm</h2>
    <div class="narrative-box">
      Before you can build, you must know what you're building <i>away from</i>. Sort each feature: does it belong to the old
      Romanesque world, or the new Gothic vision Abbot Suger is chasing?
    </div>
    <div class="pill gold sans" id="sortCounter">Feature 1 of ${items.length}</div>
    <div style="margin:16px 0;">
      <div class="card" id="currentFeature" style="text-align:center;font-size:1.05rem;font-weight:700;border:1px solid var(--gold);"></div>
    </div>
    <div class="sort-zone">
      <div class="sort-bin romanesque" id="binRomanesque"><h4 class="sans">Romanesque</h4></div>
      <div class="sort-bin gothic" id="binGothic"><h4 class="sans">Gothic</h4></div>
    </div>
  </div>`);
  app.appendChild(wrap);

  function showItem(){
    if(idx >= items.length){
      finishSort();
      return;
    }
    document.getElementById('sortCounter').textContent = `Feature ${idx+1} of ${items.length}`;
    document.getElementById('currentFeature').textContent = items[idx].text;
  }

  function handleSort(choice){
    const item = items[idx];
    const correct = choice === item.answer;
    if(correct) correctCount++;
    bumpScore(correct);
    const box = document.getElementById('currentFeature');
    box.style.borderColor = correct ? 'var(--good)' : 'var(--bad)';
    box.classList.add(correct? 'pulse-good':'shake');
    setTimeout(()=>{
      box.classList.remove('pulse-good','shake');
      box.style.borderColor='var(--gold)';
      idx++;
      showItem();
    }, 550);
  }

  document.getElementById('binRomanesque').addEventListener('click', ()=>handleSort('romanesque'));
  document.getElementById('binGothic').addEventListener('click', ()=>handleSort('gothic'));
  showItem();

  function finishSort(){
    chapterComplete(cid, correctCount, items.length);
    renderChapterResults(cid, correctCount, items.length,
      "You can now tell the old world from the new. Time to raise some stone.");
  }
}

function renderHotspotChapter(cid){
  app.innerHTML='';
  app.appendChild(el(renderHud()));
  wireBackToMap();
  const meta = CHAPTER_META[cid];
  const items = shuffle(meta.set);
  let selectedTerm = null;
  let placedCount = 0;
  let correctCount = 0;
  let attempts = 0;
  const remainingTerms = new Set(items.map(i=>i.term));

  const introText = cid==='bones'
    ? "Abbot Suger hands you the mason's plans. Every rib, every pier, every window has a name — and every name has a place. Tap a term below, then tap the matching point on the cathedral's skeleton."
    : "The walls stand; now the façade must speak. Tap a term, then tap the matching point on Chartres's face — from spire to portal.";

  const wrap = el(`<div class="fade-in card">
    <h2>${meta.icon} ${meta.title}</h2>
    <div class="narrative-box">${introText}</div>
    <div class="row between sans" style="margin-bottom:6px;">
      <span>Pieces placed: <b id="placedCount">0</b> / ${items.length}</span>
      <span>Accuracy: <b id="accCount">—</b></span>
    </div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progBar" style="width:0%"></div></div>
    <div class="hotspot-wrap" id="svgHost"></div>
    <div class="def-callout" id="defCallout">Select a term from the word bank, then tap its spot on the diagram.</div>
    <div class="term-bank" id="termBank"></div>
  </div>`);
  app.appendChild(wrap);

  document.getElementById('svgHost').appendChild(buildSVG(cid, items));

  const bank = document.getElementById('termBank');
  shuffle(items).forEach(item=>{
    const chip = el(`<button class="term-chip sans" data-term="${item.term}">${item.term}</button>`);
    chip.onclick = ()=>{
      if(chip.classList.contains('used')) return;
      document.querySelectorAll('.term-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedTerm = item.term;
      document.getElementById('defCallout').textContent = `Selected: "${item.term}" — now tap its spot on the diagram.`;
    };
    bank.appendChild(chip);
  });

  document.querySelectorAll('.hotspot').forEach(hs=>{
    hs.addEventListener('click', ()=>{
      if(!selectedTerm){
        document.getElementById('defCallout').textContent = "Pick a term from the word bank first, then tap a spot.";
        return;
      }
      const hid = hs.getAttribute('data-id');
      const item = items.find(i=>i.id===hid);
      if(hs.classList.contains('correct')) return; // already solved
      attempts++;
      if(item.term === selectedTerm){
        hs.classList.add('correct');
        hs.classList.add('pulse-good');
        correctCount++; placedCount++;
        bumpScore(true);
        document.getElementById('defCallout').innerHTML = `<b style="color:var(--good);">✓ ${item.term}:</b> ${item.def}`;
        const chip = document.querySelector(`.term-chip[data-term="${CSS.escape(item.term)}"]`);
        if(chip){ chip.classList.add('used'); }
        selectedTerm = null;
        document.getElementById('placedCount').textContent = placedCount;
        document.getElementById('accCount').textContent = Math.round((correctCount/attempts)*100)+'%';
        document.getElementById('progBar').style.width = Math.round((placedCount/items.length)*100)+'%';
        if(placedCount===items.length){
          setTimeout(()=>{
            chapterComplete(cid, correctCount, attempts);
            renderChapterResults(cid, correctCount, attempts,
              cid==='bones' ? "The bones of the cathedral now stand. Next, we dress the façade." : "Chartres's face is complete. The Guild awaits your next commission.");
          }, 900);
        }
      } else {
        hs.classList.add('wrong');
        hs.classList.add('shake');
        bumpScore(false);
        document.getElementById('defCallout').innerHTML = `<b style="color:var(--bad);">Not quite.</b> "${selectedTerm}" doesn't belong there — look again, or try another spot.`;
        setTimeout(()=>{ hs.classList.remove('wrong','shake'); }, 500);
      }
      document.getElementById('accCount').textContent = attempts? Math.round((correctCount/attempts)*100)+'%' : '—';
    });
  });
}

function renderQuizChapter(cid){

function runQuizFlow(cid, meta, questions, isBoss, timeLimit){
  app.innerHTML='';
  let timerInterval = null;
  let timeLeft = timeLimit || null;
  const extraRight = timeLimit ? `<span class="timer-badge sans" id="timerBadge">⏱ ${fmtTime(timeLeft)}</span>` : null;
  app.appendChild(el(renderHud(extraRight)));
  if(!timeLimit) wireBackToMap();

  let idx = 0, correctCount = 0;
  const shuffledQs = questions.map(orig=>{
    const order = shuffle(orig.choices.map((c,i)=>i));
    return {
      question: orig.question,
      choices: order.map(i=>orig.choices[i]),
      answerIndex: order.indexOf(orig.answerIndex),
      explanation: orig.explanation
    };
  });

  const introMap = {
    bible: "The scriptorium is quiet except for scratching quills. Prove you understand what the Moralized Bible teaches — and warns against.",
    pieta: "The Rhineland air is cold, and the carved wood before you aches with grief. Show the guild you understand German Gothic devotion.",
    chapel: "Giotto's brush has painted grief and judgment onto plaster. Step into his chapel and prove you understand his innovation.",
    haggadah: "Turn the vellum pages carefully — this Haggadah has told the Passover story for centuries. Show you understand it.",
  };

  const wrap = el(`<div class="fade-in card">
    <h2>${meta.icon} ${meta.title}</h2>
    ${introMap[cid] ? `<div class="narrative-box">${introMap[cid]}</div>` : ''}
    <div class="quiz-progress" id="quizProgress"></div>
    <h3 id="qText" class="sans" style="font-size:1.08rem;"></h3>
    <div id="qChoices"></div>
  </div>`);
  app.appendChild(wrap);

  const progressWrap = document.getElementById('quizProgress');
  shuffledQs.forEach(()=>progressWrap.appendChild(el(`<div class="dot"></div>`)));

  function updateProgressDots(){
    const dots = progressWrap.children;
    for(let i=0;i<dots.length;i++){
      dots[i].className = 'dot';
      if(i<idx) dots[i].classList.add(state._dotResults && state._dotResults[i] ? 'answered-correct' : 'answered-wrong');
      if(i===idx) dots[i].classList.add('current');
    }
  }
  state._dotResults = [];

  function showQuestion(){
    if(idx >= shuffledQs.length){
      finish();
      return;
    }
    updateProgressDots();
    const qq = shuffledQs[idx];
    document.getElementById('qText').textContent = `Q${idx+1}. ${qq.question}`;
    const cWrap = document.getElementById('qChoices');
    cWrap.innerHTML='';
    qq.choices.forEach((choice, ci)=>{
      const b = el(`<button class="quiz-choice">${choice}</button>`);
      b.onclick = ()=> answer(ci);
      cWrap.appendChild(b);
    });
  }

  function answer(ci){
    const qq = shuffledQs[idx];
    const buttons = document.querySelectorAll('.quiz-choice');
    buttons.forEach(b=>b.disabled=true);
    const correct = ci === qq.answerIndex;
    buttons[ci].classList.add(correct?'correct':'wrong');
    if(!correct) buttons[qq.answerIndex].classList.add('correct');
    state._dotResults[idx] = correct;
    if(correct) correctCount++;
    bumpScore(correct);
    const explain = el(`<div class="def-callout">${qq.explanation}</div>`);
    document.getElementById('qChoices').appendChild(explain);
    const nextBtn = el(`<button class="btn" style="margin-top:14px;">${idx+1<shuffledQs.length? 'Next →':'Finish →'}</button>`);
    document.getElementById('qChoices').appendChild(nextBtn);
    nextBtn.onclick = ()=>{ idx++; showQuestion(); };
  }

  function finish(){
    if(timerInterval) clearInterval(timerInterval);
    if(isBoss){
      renderBossResults(correctCount, shuffledQs.length);
    } else {
      chapterComplete(cid, correctCount, shuffledQs.length);
      const closingMap = {
        bible: "The scriptorium's lessons are yours now — including its hardest ones.",
        pieta: "You carry the Rhineland's grief and its craft with you.",
        chapel: "Giotto's innovations are now part of your own eye.",
        haggadah: "The story of liberation is now one you can tell yourself."
      };
      renderChapterResults(cid, correctCount, shuffledQs.length, closingMap[cid] || "Well done.");
    }
  }

  if(timeLimit){
    timerInterval = setInterval(()=>{
      timeLeft--;
      const badge = document.getElementById('timerBadge');
      if(badge){
        badge.textContent = '⏱ ' + fmtTime(Math.max(timeLeft,0));
        if(timeLeft<=15) badge.classList.add('low');
      }
      if(timeLeft<=0){
        clearInterval(timerInterval);
        finish();
      }
    },1000);
  }

  showQuestion();
}

function renderBossResults(correct, total){
  const pct = Math.round((correct/total)*100);
  let rank = 'Novice Apprentice';
  if(pct>=90) rank='Master Builder of Lux Nova';
  else if(pct>=75) rank='Journeyman Architect';
  else if(pct>=60) rank='Guild Illuminator';
  else if(pct>=40) rank='Apprentice Mason';
  updateSave(s=>{ s.guildRank = rank; if(!s.highScores.boss || pct>s.highScores.boss) s.highScores.boss=pct; s.completedChapters.boss=true; });

  app.innerHTML='';
  app.appendChild(el(renderHud()));
  wireBackToMap();
  const rows = state.chapterOrder.filter(c=>c!=='boss').map(c=>{
    const r = state.chapterResults[c];
    const meta = CHAPTER_META[c];
    if(!r) return `<div class="breakdown-row"><span>${meta.icon} ${meta.title}</span><span class="pill">not attempted this session</span></div>`;
    const p = Math.round((r.correct/r.total)*100);
    return `<div class="breakdown-row"><span>${meta.icon} ${meta.title}</span><span class="pill ${p>=70?'good':''}">${r.correct}/${r.total} (${p}%)</span></div>`;
  }).join('');

  app.appendChild(el(`<div class="fade-in card center">
    <div style="font-size:2.6rem;">🔔</div>
    <h2>The Cathedral is Consecrated</h2>
    <div class="pill gold" style="font-size:1.15rem;padding:8px 22px;margin:8px 0;">${correct} / ${total} correct (${pct}%)</div>
    <div class="rank-badge">${rank}</div>
    <div class="stone-divider"></div>
    <h3 class="sans" style="text-align:left;">Session Breakdown</h3>
    <div style="text-align:left;">${rows}</div>
    <div class="row center" style="margin-top:20px;">
      <button class="btn" id="toMap2">Return to Guild Map</button>
      <button class="btn secondary sans" id="playAgain">Rebuild the Cathedral Again</button>
    </div>
    <p class="sans" style="font-size:0.8rem;margin-top:14px;color:var(--stone-500);">Your rank is saved on this device. Every replay pulls a fresh, randomized set of questions.</p>
  </div></div>`));
  document.getElementById('toMap2').onclick = renderJourneyMap;
  document.getElementById('playAgain').onclick = ()=>{
    state.score=0; state.streak=0; state.chapterResults={};
    renderJourneyMap();
  };
}

/* ============================================================
   STUDY HALL (take-home, untimed)
   ============================================================ */
function renderStudyHall(){
  app.innerHTML='';
  app.appendChild(el(`<div class="hud"><div class="stat sans">Study Hall — untimed, no pressure</div>
    <button class="btn ghost sans" id="backToModes2" style="padding:7px 12px;font-size:0.8rem;">← Change Mode</button></div>`));
  document.getElementById('backToModes2').onclick = renderModeSelect;

  const categories = ['All', ...Array.from(new Set(GLOSSARY.map(g=>g.cat)))];
  let activeCat = 'All';
  let cardIdx = 0;
  let deck = shuffle(GLOSSARY);

  const wrap = el(`<div class="fade-in card">
    <h2>📚 Study Hall</h2>
    <p class="sans" style="font-size:0.9rem;">Flip through Gothic vocabulary at your own pace, or jump into an untimed practice quiz below. Perfect for reviewing at home before a test.</p>
    <div class="filter-row" id="catFilters"></div>
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="flip-face flip-front" id="flipFront"></div>
        <div class="flip-face flip-back" id="flipBack"></div>
      </div>
    </div>
    <div class="row center sans">
      <button class="btn secondary" id="prevCard">← Prev</button>
      <span class="pill" id="cardCounter"></span>
      <button class="btn secondary" id="nextCard">Next →</button>
      <button class="btn secondary" id="shuffleCards">🔀 Shuffle</button>
    </div>
    <div class="stone-divider"></div>
    <div class="center">
      <button class="btn" id="startPractice">Start Untimed Practice Quiz →</button>
    </div>
  </div>`);
  app.appendChild(wrap);

  const filterRow = document.getElementById('catFilters');
  categories.forEach(cat=>{
    const chip = el(`<button class="filter-chip ${cat==='All'?'active':''}">${cat}</button>`);
    chip.onclick = ()=>{
      activeCat = cat;
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      deck = shuffle(cat==='All' ? GLOSSARY : GLOSSARY.filter(g=>g.cat===cat));
      cardIdx = 0;
      showCard();
    };
    filterRow.appendChild(chip);
  });

  const flipCard = document.getElementById('flipCard');
  flipCard.onclick = ()=> flipCard.classList.toggle('flipped');

  function showCard(){
    flipCard.classList.remove('flipped');
    const item = deck[cardIdx];
    document.getElementById('flipFront').textContent = item.term;
    document.getElementById('flipBack').textContent = item.def;
    document.getElementById('cardCounter').textContent = `${cardIdx+1} / ${deck.length}`;
  }
  document.getElementById('prevCard').onclick = ()=>{ cardIdx = (cardIdx-1+deck.length)%deck.length; showCard(); };
  document.getElementById('nextCard').onclick = ()=>{ cardIdx = (cardIdx+1)%deck.length; showCard(); };
  document.getElementById('shuffleCards').onclick = ()=>{ deck = shuffle(deck); cardIdx=0; showCard(); };
  showCard();

  document.getElementById('startPractice').onclick = renderStudyPractice;
}

function renderStudyPractice(){
  // Build a matching-style MC quiz straight from the glossary, untimed, huge pool
  const pool = shuffle(GLOSSARY).slice(0, 15).map(item=>{
    const wrongs = sample(GLOSSARY.filter(g=>g.term!==item.term), 3).map(g=>g.def);
    const choices = shuffle([item.def, ...wrongs]);
    return q(`What does "${item.term}" mean?`, choices, choices.indexOf(item.def), `${item.term}: ${item.def}`);
  });
  runQuizFlow('study', {title:'Study Hall Practice', icon:'📚'}, pool, false);
  // Override finish behavior: since 'study' isn't in chapterOrder, chapterComplete just harmlessly records it.
}

/* ============================================================
   NIGHT BEFORE SPEED ROUND
   ============================================================ */
function renderSpeedRound(){
  app.innerHTML='';
  app.appendChild(el(`<div class="hud"><div class="stat sans">⚡ Night Before Speed Round — 90 seconds, endless replay</div>
    <button class="btn ghost sans" id="backToModes3" style="padding:7px 12px;font-size:0.8rem;">← Change Mode</button></div>`));
  document.getElementById('backToModes3').onclick = renderModeSelect;

  const save = getSave();
  const best = save.highScores.speedround || 0;

  app.appendChild(el(`<div class="fade-in card center">
    <div style="font-size:2.4rem;">⚡</div>
    <h2>Night Before Speed Round</h2>
    <p>Rapid-fire questions from every corner of Unit 3.5 — architecture vocab, Chartres, the Moralized Bible, the Röttgen Pietà,
    the Arena Chapel, and the Golden Haggadah. You have <b>90 seconds</b>. Answer as many as you can. Replay as many times as you like —
    the questions rotate every round.</p>
    <div class="pill gold">Best correct-answer score on this device: ${best}</div>
    <button class="btn" id="startSpeed" style="margin-top:16px;">Start the Clock →</button>
  </div></div>`));

  document.getElementById('startSpeed').onclick = ()=>{
    const allBanks = [...MORALIZED_BIBLE_BANK, ...ROTTGEN_PIETA_BANK, ...ARENA_CHAPEL_BANK, ...GOLDEN_HAGGADAH_BANK, ...HISTORY_BANK,
      ...GLOSSARY.map(item=>{
        const wrongs = sample(GLOSSARY.filter(g=>g.term!==item.term), 3).map(g=>g.def);
        const choices = shuffle([item.def, ...wrongs]);
        return q(`What does "${item.term}" mean?`, choices, choices.indexOf(item.def), `${item.term}: ${item.def}`);
      })
    ];
    const speedQs = sample(allBanks, 30);
    runSpeedQuiz(speedQs, 90);
  };
}

function runSpeedQuiz(questions, seconds){
  app.innerHTML='';
  let idx=0, correct=0, timeLeft=seconds;
  const shuffledQs = questions.map(orig=>{
    const order = shuffle(orig.choices.map((c,i)=>i));
    return {question:orig.question, choices:order.map(i=>orig.choices[i]), answerIndex:order.indexOf(orig.answerIndex)};
  });

  app.appendChild(el(`<div class="hud">
    <div class="stat sans">Correct: <b id="speedCorrect">0</b></div>
    <span class="timer-badge sans" id="speedTimer">⏱ ${fmtTime(timeLeft)}</span>
  </div>`));

  const wrap = el(`<div class="fade-in card">
    <h3 class="sans" id="speedQText" style="font-size:1.1rem;"></h3>
    <div id="speedChoices"></div>
  </div>`);
  app.appendChild(wrap);

  function showQ(){
    if(idx>=shuffledQs.length || timeLeft<=0){ finishSpeed(); return; }
    const qq = shuffledQs[idx];
    document.getElementById('speedQText').textContent = qq.question;
    const cWrap = document.getElementById('speedChoices');
    cWrap.innerHTML='';
    qq.choices.forEach((c,ci)=>{
      const b = el(`<button class="quiz-choice">${c}</button>`);
      b.onclick = ()=>{
        if(timeLeft<=0) return;
        const isCorrect = ci===qq.answerIndex;
        b.classList.add(isCorrect?'correct':'wrong');
        if(isCorrect){ correct++; document.getElementById('speedCorrect').textContent = correct; }
        setTimeout(()=>{ idx++; showQ(); }, 220);
        document.querySelectorAll('#speedChoices .quiz-choice').forEach(x=>x.disabled=true);
      };
      cWrap.appendChild(b);
    });
  }

  const timerInt = setInterval(()=>{
    timeLeft--;
    const badge = document.getElementById('speedTimer');
    if(badge){ badge.textContent = '⏱ ' + fmtTime(Math.max(timeLeft,0)); if(timeLeft<=15) badge.classList.add('low'); }
    if(timeLeft<=0){ clearInterval(timerInt); finishSpeed(); }
  },1000);

  function finishSpeed(){
    clearInterval(timerInt);
    updateSave(s=>{ if(!s.highScores.speedround || correct>s.highScores.speedround) s.highScores.speedround = correct; });
    app.innerHTML='';
    app.appendChild(el(`<div class="fade-in card center">
      <div style="font-size:2.4rem;">⚡</div>
      <h2>Time's Up!</h2>
      <div class="pill gold" style="font-size:1.15rem;padding:8px 20px;">You answered <b>${correct}</b> correctly.</div>
      <div class="row center" style="margin-top:18px;">
        <button class="btn" id="speedAgain">Run It Again</button>
        <button class="btn secondary sans" id="speedHome">Back to Modes</button>
      </div>
    </div></div>`));
    document.getElementById('speedAgain').onclick = renderSpeedRound;
    document.getElementById('speedHome').onclick = renderModeSelect;
  }

  showQ();
}
