<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink &amp; Symbols: An Apprentice Printmaker's Journey</title>
<style>
  :root{
    --ink:#241a12;
    --ink-soft:#3a2a1c;
    --vellum:#ecdfc0;
    --vellum-2:#e2d3ab;
    --vellum-dark:#cbb98c;
    --oxblood:#7a2419;
    --oxblood-dark:#5a1810;
    --verdigris:#4f6b57;
    --verdigris-dark:#37493f;
    --gold:#a9791f;
    --gold-light:#d8b95c;
    --shadow:rgba(36,26,18,.35);
    --paper-line:rgba(36,26,18,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #4a3a26 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #2f2416 0%, transparent 55%),
      linear-gradient(160deg,#1c140c,#0f0b07);
    min-height:100vh;
    font-family:Georgia,'Times New Roman',serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:22px 12px 60px;
  }
  #app{width:100%;max-width:920px;}

  .press-title{
    text-align:center;color:var(--vellum-2);margin-bottom:14px;
  }
  .press-title h1{
    font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;
    font-weight:400;margin:0 0 4px;color:var(--gold-light);
    font-variant-caps:small-caps;
  }
  .press-title .sub{font-size:.78rem;letter-spacing:.08em;color:#b3a184;font-style:italic;}

  .sheet{
    position:relative;
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0 1px, transparent 1px 28px),
      linear-gradient(135deg,var(--vellum),var(--vellum-2) 60%, var(--vellum-dark));
    clip-path:polygon(
      0.6% 1.5%, 8% 0%, 22% 0.8%, 40% 0%, 58% 0.6%, 76% 0%, 92% 0.9%, 100% 0%,
      99.3% 12%, 100% 30%, 99.4% 48%, 100% 66%, 99.5% 84%, 100% 100%,
      82% 99.2%, 64% 100%, 46% 99.3%, 28% 100%, 12% 99.4%, 0% 100%,
      0.7% 82%, 0% 64%, 0.5% 46%, 0% 28%, 0.6% 12%
    );
    padding:34px 38px 40px;
    box-shadow:0 24px 60px var(--shadow), 0 2px 0 rgba(255,255,255,.15) inset;
    min-height:420px;
  }
  @media (max-width:640px){
    .sheet{padding:22px 16px 28px;}
  }

  .proof-strip{
    display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;
  }
  .seal-slot{
    width:38px;height:38px;border-radius:50%;
    border:2px dashed var(--vellum-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:.65rem;color:#a4906a;background:rgba(255,255,255,.15);
    transition:all .35s;
  }
  .seal-slot.done{
    border:2px solid var(--oxblood);
    background:radial-gradient(circle at 35% 30%, #9a3325, var(--oxblood) 70%);
    color:var(--vellum);font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.4);
    animation:stamp .4s ease-out;
  }
  @keyframes stamp{
    0%{transform:scale(2.4) rotate(-14deg);opacity:0;}
    60%{transform:scale(.9) rotate(4deg);opacity:1;}
    100%{transform:scale(1) rotate(0);}
  }

  h2.stop-title{
    font-variant-caps:small-caps;letter-spacing:.05em;
    font-size:1.6rem;margin:0 0 2px;color:var(--ink);border-bottom:3px double var(--ink-soft);
    padding-bottom:8px;
  }
  .stop-meta{font-size:.85rem;color:var(--ink-soft);font-style:italic;margin-bottom:16px;}
  .stop-meta b{font-style:normal;}

  .narrative-box{
    background:rgba(255,255,255,.28);border-left:4px solid var(--oxblood);
    padding:14px 18px;margin:14px 0;border-radius:2px;font-size:1rem;line-height:1.55;
  }
  .narrative-box p{margin:0 0 8px;}
  .narrative-box p:last-child{margin-bottom:0;}

  .btn{
    font-family:Georgia,serif;font-variant-caps:small-caps;letter-spacing:.04em;
    background:linear-gradient(180deg,var(--oxblood),var(--oxblood-dark));
    color:var(--vellum);border:none;padding:11px 22px;border-radius:4px;
    cursor:pointer;font-size:1rem;box-shadow:0 3px 0 rgba(0,0,0,.35), 0 5px 10px rgba(0,0,0,.25);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
  .btn.secondary{
    background:linear-gradient(180deg,#6b7a63,var(--verdigris-dark));
  }
  .btn.gold{
    background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--ink);
  }
  .btn.ghost{
    background:transparent;color:var(--ink-soft);box-shadow:none;border:2px solid var(--ink-soft);
    padding:9px 18px;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .home-link{
    font-size:.78rem;color:var(--ink-soft);cursor:pointer;text-decoration:underline;
    font-variant-caps:small-caps;letter-spacing:.03em;
  }
  .home-link:hover{color:var(--oxblood);}

  /* Title screen */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;}
  @media (max-width:640px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    border:2px solid var(--ink-soft);border-radius:6px;padding:16px;background:rgba(255,255,255,.25);
    cursor:pointer;transition:transform .15s, box-shadow .15s;
  }
  .mode-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.25);border-color:var(--oxblood);}
  .mode-card h3{margin:0 0 6px;font-variant-caps:small-caps;letter-spacing:.03em;color:var(--oxblood);}
  .mode-card p{margin:0;font-size:.87rem;line-height:1.4;color:var(--ink-soft);}
  .mode-card .tag{
    display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;
    background:var(--verdigris);color:var(--vellum);padding:2px 8px;border-radius:10px;margin-bottom:8px;
  }

  .route-map{display:flex;justify-content:center;gap:6px;margin:18px 0;flex-wrap:wrap;font-size:.72rem;color:var(--ink-soft);}
  .route-map span:not(:last-child)::after{content:" → ";color:var(--vellum-dark);}

  /* Minigame */
  .mg-instructions{font-size:.88rem;font-style:italic;color:var(--ink-soft);margin-bottom:12px;}
  .match-cols{display:flex;gap:22px;justify-content:space-between;flex-wrap:wrap;}
  .match-col{flex:1;min-width:230px;display:flex;flex-direction:column;gap:8px;}
  .chip{
    border:2px solid var(--ink-soft);background:rgba(255,255,255,.4);
    padding:10px 12px;border-radius:4px;cursor:pointer;font-size:.9rem;line-height:1.3;
    transition:all .15s;user-select:none;
  }
  .chip:hover{background:rgba(255,255,255,.7);}
  .chip.selected{border-color:var(--oxblood);background:#f4e3c9;box-shadow:0 0 0 2px var(--oxblood) inset;}
  .chip.matched{border-color:var(--verdigris);background:#dfe9e0;color:var(--verdigris-dark);cursor:default;opacity:.75;}
  .chip.wrong{animation:shake .32s;border-color:#a33;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}
  }

  .seq-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .seq-item{
    display:flex;align-items:center;gap:10px;border:2px solid var(--ink-soft);
    background:rgba(255,255,255,.4);padding:9px 12px;border-radius:4px;cursor:grab;font-size:.9rem;
  }
  .seq-item.fixed{background:repeating-linear-gradient(45deg,#e6dcc0,#e6dcc0 6px,#d8ccaa 6px,#d8ccaa 12px);color:#8a7c5c;cursor:default;font-style:italic;}
  .seq-item.correct-flash{border-color:var(--verdigris);}
  .seq-num{
    background:var(--ink-soft);color:var(--vellum);width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;
  }
  .seq-controls{display:flex;flex-direction:column;gap:3px;margin-left:auto;}
  .seq-controls button{
    background:var(--ink-soft);color:var(--vellum);border:none;border-radius:3px;width:24px;height:20px;cursor:pointer;font-size:.7rem;
  }

  .sort-boards{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;}
  .sort-board{
    flex:1;min-width:230px;border:2px solid var(--ink-soft);border-radius:6px;padding:10px;
    min-height:160px;background:rgba(255,255,255,.25);
  }
  .sort-board h4{margin:0 0 8px;text-align:center;font-variant-caps:small-caps;letter-spacing:.04em;}
  .sort-board.law h4{color:var(--oxblood);}
  .sort-board.grace h4{color:var(--verdigris-dark);}
  .sort-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;}
  .pool-chip{
    border:2px solid var(--ink-soft);background:#f4ecd7;padding:7px 10px;border-radius:14px;
    cursor:pointer;font-size:.82rem;
  }
  .pool-chip.selected{background:var(--gold-light);border-color:var(--gold);}
  .sort-target{
    display:inline-block;border:1px dashed var(--vellum-dark);background:rgba(255,255,255,.5);
    padding:6px 9px;border-radius:12px;margin:3px;font-size:.8rem;
  }

  .feedback-banner{
    margin-top:12px;padding:10px 14px;border-radius:4px;font-size:.9rem;display:none;
  }
  .feedback-banner.show{display:block;}
  .feedback-banner.good{background:#dbe9dc;border:1px solid var(--verdigris);color:var(--verdigris-dark);}
  .feedback-banner.bad{background:#f1dcd8;border:1px solid var(--oxblood);color:var(--oxblood-dark);}

  /* Quiz */
  .quiz-progress{font-size:.78rem;color:var(--ink-soft);margin-bottom:8px;font-style:italic;}
  .quiz-q{font-size:1.05rem;margin:0 0 14px;font-weight:bold;}
  .quiz-choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    border:2px solid var(--ink-soft);background:rgba(255,255,255,.35);padding:11px 14px;
    border-radius:4px;cursor:pointer;font-size:.92rem;
  }
  .choice:hover{background:rgba(255,255,255,.65);}
  .choice.correct{background:#dbe9dc;border-color:var(--verdigris);}
  .choice.incorrect{background:#f1dcd8;border-color:var(--oxblood);}
  .choice.disabled{cursor:default;}
  .note-box{
    margin-top:12px;background:rgba(255,255,255,.4);border-left:4px solid var(--gold);
    padding:10px 14px;font-size:.86rem;font-style:italic;
  }

  .score-badge{
    display:inline-block;background:var(--verdigris);color:var(--vellum);padding:3px 10px;
    border-radius:12px;font-size:.75rem;margin-left:8px;font-style:normal;
  }

  /* Certificate */
  .cert{
    text-align:center;padding:20px 10px;
  }
  .cert h2{font-variant-caps:small-caps;font-size:1.8rem;color:var(--oxblood);margin-bottom:4px;}
  .wax-seal{
    width:110px;height:110px;border-radius:50%;margin:14px auto;
    background:radial-gradient(circle at 35% 30%, #a5392a, var(--oxblood) 70%, var(--oxblood-dark));
    display:flex;align-items:center;justify-content:center;color:var(--vellum);
    font-size:.75rem;font-variant-caps:small-caps;letter-spacing:.05em;text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.3);
    border:3px solid #8a2e20;line-height:1.2;padding:8px;
  }
  .cert-code{font-family:'Courier New',monospace;letter-spacing:.15em;font-size:1rem;color:var(--ink-soft);margin:10px 0;}

  .fieldwrap{margin:14px 0;}
  .fieldwrap input{
    font-family:Georgia,serif;font-size:1rem;padding:8px 10px;border:2px solid var(--ink-soft);
    border-radius:4px;background:rgba(255,255,255,.6);width:260px;
  }

  .flash-timer{
    position:sticky;top:6px;text-align:center;font-family:'Courier New',monospace;font-size:1.1rem;
    background:var(--ink);color:var(--gold-light);padding:5px 0;border-radius:4px;margin-bottom:10px;
    letter-spacing:.08em;
  }

  .studyhall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px;}
  .fact-card{border:2px solid var(--ink-soft);border-radius:6px;padding:12px;background:rgba(255,255,255,.35);}
  .fact-card h4{margin:0 0 4px;font-variant-caps:small-caps;color:var(--oxblood);}
  .fact-card p{margin:2px 0;font-size:.82rem;}
  .vocab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px;}
  .vocab-card{border:1px solid var(--vellum-dark);background:rgba(255,255,255,.4);padding:8px 10px;border-radius:4px;font-size:.82rem;}
  .vocab-card b{color:var(--oxblood);font-variant-caps:small-caps;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   INK & SYMBOLS — data & engine
   ========================================================= */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function esc(s){ return (s+"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- STOPS DATA ---------- */
const STOPS = [
{
  key:"campin", num:1, city:"Bruges", seal:"MA",
  title:"The Mérode Altarpiece", artist:"Robert Campin (or his workshop)",
  year:"1425–1428 C.E.", medium:"Oil on wood, triptych", loc:"Metropolitan Museum of Art, New York",
  intro:[
    "The master hands you a fresh-cut quill and a commission slip: <b>Bruges</b>. A wealthy wool merchant wants a pamphlet made of the small house-altar he keeps in his private study — three hinged panels, no bigger than a cupboard door.",
    "\"Sketch everything,\" the master warns. \"Campin's workshop hides theology in the furniture. Miss a detail and the print is worthless.\""
  ],
  minigame:{ type:"match", title:"Read the Panels",
    instructions:"Click a symbol on the left, then click the meaning it belongs to on the right. Everyday objects here are never just décor.",
    pairs:[
      {sym:"Walled garden & blooming rose bush (left panel)", meaning:"Hortus conclusus — an \"enclosed garden\" evoking Mary's purity and the Garden of Eden"},
      {sym:"Extinguished candle & thin wisp of smoke", meaning:"Divine light (the Holy Spirit) arriving outshines and snuffs the earthly candle"},
      {sym:"Lilies in the vase on the table", meaning:"A traditional emblem of Mary's purity and virginity"},
      {sym:"Seven rays of light passing through the unbroken window", meaning:"The Immaculate Conception — the divine enters without breaking the glass, just as Mary remains a virgin"},
      {sym:"Mousetraps on Joseph's workbench", meaning:"A theological pun (traced to St. Augustine) — Christ as bait set to trap the Devil"},
      {sym:"Donor kneeling in the open doorway (left panel)", meaning:"The patron who paid for the altarpiece, painted directly into the sacred scene"}
    ]
  },
  quiz:[
    {q:"Who created (or whose workshop created) the Mérode Altarpiece?", choices:["Robert Campin (or his workshop)","Jan van Eyck","Albrecht Dürer","Matthias Grünewald"], a:0},
    {q:"What medium is the Mérode Altarpiece painted in?", choices:["Fresco on plaster","Oil on wood","Tempera on canvas","Engraving on copper"], a:1},
    {q:"What term describes an altarpiece made of three hinged panels?", choices:["Predella","Diptych","Triptych","Reliquary"], a:2},
    {q:"What do we call the patron shown kneeling and witnessing the sacred scene?", choices:["Acolyte","Donor","Apostle","Iconoclast"], a:1},
    {q:"The Mérode Altarpiece is unusual among many altarpieces because it lacks which structural feature at its base?", choices:["A triptych frame","Gold leaf","A predella","An inscription"], a:2},
    {q:"What do the mousetraps on Joseph's workbench most likely symbolize?", choices:["Joseph's trade as a carpenter, nothing more","Poverty in the household","Christ as bait set to trap the Devil, per a theological pun traced to St. Augustine","A warning against sin for the viewer's own home"], a:2},
    {q:"What does the extinguished candle with its wisp of smoke suggest?", choices:["The room is poorly lit","Divine light (the Holy Spirit) has just arrived and outshines it","The scene takes place at midday","Joseph forgot to relight it"], a:1},
    {q:"What do the lilies on the table symbolize?", choices:["Wealth and luxury","Mary's purity and virginity","The changing seasons","The donor's family crest"], a:1},
    {q:"Why might \"Quattrocento\" be a misleading label for the Mérode Altarpiece, even though it dates to the 1420s?", choices:["The term only applies to sculpture","Quattrocento specifically describes 15th-century Italian art, and this is Flemish/Northern European","The term only applies to architecture","The altarpiece was actually painted in the 1500s"], a:1},
    {q:"What is significant about the rays of light passing through the window without breaking the glass?", choices:["It shows the artist's mastery of perspective alone","It symbolizes the Immaculate Conception — the divine entering without breaking Mary's virginity","It represents lightning from an approaching storm","It has no symbolic meaning; it is purely decorative"], a:1},
    {q:"Where is the Mérode Altarpiece located today?", choices:["The Louvre, Paris","The National Gallery, London","The Metropolitan Museum of Art, New York","Musée d'Unterlinden, Colmar"], a:2},
    {q:"What does the walled garden with the rose bush in the left panel evoke?", choices:["The donor's actual estate","Hortus conclusus — an enclosed garden symbolizing Mary's purity and paradise","The city of Bruges itself","A reference to the Protestant Reformation"], a:1},
    {q:"This altarpiece was most likely intended for what kind of setting?", choices:["A cathedral's main altar","Private devotion in a wealthy merchant's home","A monastery's refectory","A royal coronation hall"], a:1},
    {q:"What is depicted in the altarpiece's right-hand panel?", choices:["Joseph working in his carpentry shop","The Nativity","Adam and Eve","A donor portrait"], a:0}
  ]
},
{
  key:"vaneyck", num:2, city:"Bruges", seal:"AP",
  title:"Giovanni Arnolfini and His Bride", artist:"Jan van Eyck",
  year:"1434 C.E.", medium:"Oil on wood", loc:"National Gallery, London",
  intro:[
    "Two streets over, a rival workshop lets you study Jan van Eyck's portrait of a merchant couple in their own bedchamber. It is small, dim, and every object in the room seems to be a witness.",
    "\"Van Eyck signed the wall like a notary signs a contract,\" your master mutters, squinting at the mirror. \"Find out why."
  ],
  minigame:{ type:"match", title:"The Mirror's Witness",
    instructions:"Match each detail from the Arnolfini portrait to what it likely signals about the scene.",
    pairs:[
      {sym:"Single lit candle in the chandelier, in broad daylight", meaning:"The unseen presence of God witnessing the vow"},
      {sym:"Small dog standing at the couple's feet", meaning:"Fidelity and loyalty"},
      {sym:"Wooden pattens (clogs) discarded on the floor", meaning:"Removing one's shoes signals that this ground has become holy"},
      {sym:"Convex mirror ringed with tiny roundels", meaning:"The roundels depict the Passion of Christ; the mirror itself reflects two hidden witnesses in the room"},
      {sym:"Signature painted above the mirror", meaning:"\"Jan van Eyck was here\" — the artist inserts himself as a legal witness to the event"},
      {sym:"Oranges resting on the chest by the window", meaning:"Costly imported fruit, a quiet display of the couple's wealth"}
    ]
  },
  quiz:[
    {q:"Who painted the Arnolfini Portrait?", choices:["Jan van Eyck","Robert Campin","Pieter Bruegel the Elder","Lucas Cranach the Elder"], a:0},
    {q:"In what year was the Arnolfini Portrait completed?", choices:["1425","1434","1504","1565"], a:1},
    {q:"What medium is the Arnolfini Portrait painted in?", choices:["Oil on wood","Fresco","Engraving","Tempera on panel"], a:0},
    {q:"Where is the Arnolfini Portrait housed today?", choices:["National Gallery, London","Metropolitan Museum of Art, New York","Musée d'Unterlinden, Colmar","Kunsthistorisches Museum, Vienna"], a:0},
    {q:"What does the artist's signature above the mirror translate to, and why does it matter?", choices:["\"Property of the church\" — a claim of ownership","\"Jan van Eyck was here\" — positioning the artist as a witness to the event, almost like a legal signature","\"Sold to Arnolfini\" — a receipt of sale","A simple date with no further meaning"], a:1},
    {q:"What is depicted in the roundels surrounding the convex mirror?", choices:["Scenes from the life of the donor","Scenes from the Passion of Christ","Portraits of the couple's ancestors","Images of the four temperaments"], a:1},
    {q:"What might the single lit candle in the chandelier, burning in daylight, symbolize?", choices:["A household accident","The presence of God witnessing the event","A funeral rite","Nothing; it is purely decorative"], a:1},
    {q:"What does the small dog at the couple's feet commonly symbolize in Northern portraiture?", choices:["Wealth alone","Fidelity and loyalty","The couple's travels","A hunting trophy"], a:1},
    {q:"Why are the wooden pattens (clogs) shown discarded on the floor?", choices:["The couple simply forgot them","Removing shoes signals that the ground has become holy, appropriate for a sacred vow","It shows the room is untidy","They belong to a servant, not the couple"], a:1},
    {q:"The Arnolfini Portrait is often cited as evidence of what broader shift in Northern Renaissance patronage?", choices:["The decline of oil painting","The rise of merchant-class patrons commissioning secular, personal works","The dominance of church commissions","The spread of fresco technique"], a:1},
    {q:"What does oil paint allow an artist like van Eyck to achieve that tempera does not as easily?", choices:["Faster drying so the panel can travel sooner","Slow drying that allows layering and blending for luminous detail and rich color","A completely matte, flat finish","The ability to paint directly on wet plaster"], a:1},
    {q:"True or false: the bride is pregnant in this portrait.", choices:["True — she is visibly expecting","False — it's a common misconception; fashion of the era involved gathering fabric at the front","True, and this is confirmed by van Eyck's letters","False, because it is actually a portrait of two men"], a:1}
  ]
},
{
  key:"durer", num:3, city:"Nuremberg", seal:"E",
  title:"The Fall of Man (Adam and Eve)", artist:"Albrecht Dürer",
  year:"1504 C.E.", medium:"Engraving", loc:"Museum of Fine Arts, Boston",
  intro:[
    "The road takes you east to Nuremberg, to the press of Albrecht Dürer himself — a printmaker so precise that merchants across Europe collect his engravings the way others collect paintings.",
    "He hands you a burin and a scrap of copper. \"Before you copy my Adam and Eve,\" he says, \"you'll need to know what your hands are doing — and what my animals are doing in that garden.\""
  ],
  minigame:{ type:"combo",
    parts:[
      { type:"sequence", title:"Set the Plate",
        instructions:"Put Dürer's engraving process in the correct order.",
        items:[
          {id:"a", text:"A burin carves fine lines directly into a metal plate"},
          {id:"b", text:"Ink is worked into the carved crevices of the plate"},
          {id:"c", text:"Paper is pressed onto the plate, lifting an inked impression"}
        ],
        correctOrder:["a","b","c"]
      },
      { type:"match", title:"Four Animals, Four Temperaments",

const VOCAB = [
  {term:"Altarpiece", def:"A painted or sculpted panel (or set of panels) set atop or behind a church altar."},
  {term:"Donor", def:"A patron of a work of art, often shown within that work witnessing the sacred scene."},
  {term:"Engraving", def:"A printmaking method in which a burin carves lines directly into a metal plate."},
  {term:"Indulgences", def:"Payments made by Catholics believed to reduce punishment for sin — a major target of Luther's 95 Theses."},
  {term:"Oil Paint", def:"A slow-drying paint that allowed Northern artists to build up rich color and minute detail in layers."},
  {term:"Predella", def:"The base of an altarpiece, often filled with small narrative paintings or sculptures."},
  {term:"Printmaking", def:"Techniques (woodcut, engraving, etching) for mechanically reproducing images on paper."},
  {term:"Protestant Reformation", def:"The 16th-century religious movement, sparked by Martin Luther, that split Western Christianity."},
  {term:"Quattrocento", def:"Italian term for the 1400s — specifically describing 15th-century Italian art, not Northern European art."},
  {term:"Triptych", def:"A three-paneled painting or sculpture, often hinged so the outer wings can fold shut."},
  {term:"Woodcut", def:"A printmaking method in which a design is carved into a wooden block, leaving raised areas to be inked."},
  {term:"Etching", def:"A printmaking method using acid to bite lines into a wax-coated metal plate — capable of very fine detail."}
];

const LS_KEY = "inkSymbols_v1";
function loadSave(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function writeSave(data){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}

  playerName:""

const app = document.getElementById("app");

function header(){
  return '<div class="press-title"><h1>Ink &amp; Symbols</h1><div class="sub">An Apprentice Printmaker\'s Journey through the Northern Renaissance</div></div>';
}
function proofStrip(){
  let html = '<div class="proof-strip">';
  STOPS.forEach(s=>{
    const done = STATE.completedStops.includes(s.key);
    html += '<div class="seal-slot'+(done?' done':'')+'" title="'+esc(s.title)+'">'+(done?esc(s.seal):(s.num))+'</div>';
  });
  html += '</div>';
  return html;
}
function homeLink(){
  return '<div class="topbar"><span class="home-link" onclick="goHome()">&larr; Return to the Print Shop</span><span class="home-link" onclick="resetProgress()">Clear my apprenticeship record</span></div>';
}

  STATE.mode = null;
  render();
}
function resetProgress(){
  if(confirm("This clears your saved apprenticeship progress on this device. Continue?")){
    STATE.completedStops = [];
    STATE.stopIndex = 0;

}

/* ---------- MINIGAME ENGINE ---------- */
let MG = {}; // transient minigame state

function renderMinigame(){
  const stop = STOPS[STATE.stopIndex];
  MG = { stop, subIndex:0, results:[] };
  renderMinigameStep();
}

function renderMinigameStep(){
  const stop = MG.stop;
  const mgDef = stop.minigame;
  let part;
  if(mgDef.type === "combo"){
    part = mgDef.parts[MG.subIndex];
  } else {
    part = mgDef;
  }
  const shell = header() + '<div class="sheet">' + homeLink() + proofStrip() +
    '<div class="stop-meta">Commission '+stop.num+' of '+STOPS.length+' &middot; '+esc(stop.city)+'</div>' +
    '<h2 class="stop-title">'+esc(part.title || mgDef.title)+'</h2>' +
    '<div class="mg-instructions">'+esc(part.instructions)+'</div>' +
    '<div id="mg-body"></div>' +
    '<div class="feedback-banner" id="mg-feedback"></div>' +
    '<div class="btn-row" id="mg-actions"></div>' +
    '</div>';
  app.innerHTML = shell;

  if(part.type === "match" || (mgDef.type === "match")){
    buildMatchGame(part.type ? part : mgDef);
  } else if(part.type === "sequence" || (mgDef.type === "sequence" && mgDef.type !== "combo")){
    buildSequenceGame(part.type ? part : mgDef);
  } else if(part.type === "sort" || (mgDef.type === "sort")){
    buildSortGame(part.type ? part : mgDef);
  }
}

function advanceMinigame(){
  const mgDef = MG.stop.minigame;
  if(mgDef.type === "combo" && MG.subIndex < mgDef.parts.length - 1){
    MG.subIndex++;
    renderMinigameStep();
  } else {
    renderQuiz();
  }
}

/* ---- MATCH minigame ---- */
function buildMatchGame(def){
  const pairs = shuffle(def.pairs).map((p,i)=>({...p, id:"p"+i, matched:false}));
  const leftOrder = shuffle(pairs.map(p=>p.id));
  const rightOrder = shuffle(pairs.map(p=>p.id));
  MG.matchState = { pairs, selectedLeft:null, selectedRight:null, matchedCount:0 };

  const byId = {}; pairs.forEach(p=>byId[p.id]=p);
  MG.matchState.byId = byId;

  let html = '<div class="match-cols"><div class="match-col" id="mg-left">';
  leftOrder.forEach(id=>{
    html += '<div class="chip" data-side="left" data-id="'+id+'" onclick="matchClick(\'left\',\''+id+'\')">'+esc(byId[id].sym)+'</div>';
  });
  html += '</div><div class="match-col" id="mg-right">';
  rightOrder.forEach(id=>{
    html += '<div class="chip" data-side="right" data-id="'+id+'" onclick="matchClick(\'right\',\''+id+'\')">'+esc(byId[id].meaning)+'</div>';
  });
  html += '</div></div>';
  document.getElementById("mg-body").innerHTML = html;
  document.getElementById("mg-actions").innerHTML = '<span id="mg-progress">0 of '+pairs.length+' matched</span>';
}
function matchClick(side,id){
  const ms = MG.matchState;
  const chip = document.querySelector('.chip[data-side="'+side+'"][data-id="'+id+'"]');
  if(chip.classList.contains("matched")) return;
  if(side === "left"){
    document.querySelectorAll('.chip[data-side="left"]').forEach(c=>c.classList.remove("selected"));
    ms.selectedLeft = id; chip.classList.add("selected");
  } else {
    document.querySelectorAll('.chip[data-side="right"]').forEach(c=>c.classList.remove("selected"));
    ms.selectedRight = id; chip.classList.add("selected");
  }
  if(ms.selectedLeft && ms.selectedRight){
    const leftChip = document.querySelector('.chip[data-side="left"][data-id="'+ms.selectedLeft+'"]');
    const rightChip = document.querySelector('.chip[data-side="right"][data-id="'+ms.selectedRight+'"]');
    if(ms.selectedLeft === ms.selectedRight){
      leftChip.classList.remove("selected"); rightChip.classList.remove("selected");
      leftChip.classList.add("matched"); rightChip.classList.add("matched");
      ms.matchedCount++;
      document.getElementById("mg-progress").textContent = ms.matchedCount + " of " + ms.pairs.length + " matched";
      if(ms.matchedCount === ms.pairs.length){
        document.getElementById("mg-actions").innerHTML += '<button class="btn gold" onclick="advanceMinigame()">Continue</button>';
      }
    } else {
      leftChip.classList.add("wrong"); rightChip.classList.add("wrong");
      setTimeout(()=>{leftChip.classList.remove("wrong","selected"); rightChip.classList.remove("wrong","selected");}, 420);
    }
    ms.selectedLeft = null; ms.selectedRight = null;
  }
}

/* ---- SEQUENCE minigame ---- */
function buildSequenceGame(def){
  let items = shuffle(def.items.filter(it=>!it.fixed));
  const fixedItems = def.items.filter(it=>it.fixed);
  MG.seqState = { def, order: fixedItems.length ? mixFixed(def.items, items) : items };
  renderSeqList();
}
function mixFixed(originalItems, shuffledMovable){
  // Rebuild full list preserving fixed items in their original absolute positions,
  // filling movable slots with shuffled movable items.
  let movableQueue = shuffledMovable.slice();
  return originalItems.map(it => it.fixed ? it : movableQueue.shift());
}
function renderSeqList(){
  const order = MG.seqState.order;
  let html = '<div class="seq-list" id="seq-list">';
  order.forEach((item,i)=>{
    const cls = item.fixed ? "seq-item fixed" : "seq-item";
    html += '<div class="'+cls+'" data-id="'+item.id+'">' +
      '<span class="seq-num">'+(i+1)+'</span><span>'+esc(item.text)+'</span>';
    if(!item.fixed){
      html += '<span class="seq-controls"><button onclick="seqMove('+i+',-1)">&uarr;</button><button onclick="seqMove('+i+',1)">&darr;</button></span>';
    }
    html += '</div>';
  });
  html += '</div>';
  document.getElementById("mg-body").innerHTML = html;
  document.getElementById("mg-actions").innerHTML = '<button class="btn" onclick="checkSequence()">Check Order</button>';
}
function seqMove(index, dir){
  const order = MG.seqState.order;
  const target = index + dir;
  if(target < 0 || target >= order.length) return;
  if(order[index].fixed || order[target].fixed) return; // can't swap into fixed slots
  [order[index], order[target]] = [order[target], order[index]];
  renderSeqList();
}
function checkSequence(){
  const def = MG.seqState.def;
  const order = MG.seqState.order.map(it=>it.id);
  const correct = def.correctOrder;
  const fb = document.getElementById("mg-feedback");
  if(JSON.stringify(order) === JSON.stringify(correct)){
    fb.className = "feedback-banner show good";
    fb.textContent = "Correct order! Your sketch of the sequence is accurate.";
    document.getElementById("mg-actions").innerHTML = '<button class="btn gold" onclick="advanceMinigame()">Continue</button>';
  } else {
    fb.className = "feedback-banner show bad";
    fb.textContent = "Not quite the right order yet — use the arrows to rearrange, then check again.";
  }
}

/* ---- SORT minigame ---- */
function buildSortGame(def){
  MG.sortState = { def, pool: shuffle(def.items).map((it,i)=>({...it,id:"s"+i,placed:null})), selected:null };
  renderSort();
}
function renderSort(){
  const st = MG.sortState;
  const def = st.def;
  let html = '<div class="sort-boards">' +
    '<div class="sort-board law" id="board-law"><h4>'+esc(def.left.label)+'</h4><div id="items-law"></div></div>' +
    '<div class="sort-board grace" id="board-grace"><h4>'+esc(def.right.label)+'</h4><div id="items-grace"></div></div>' +
    '</div><div class="sort-pool" id="sort-pool"></div>';
  document.getElementById("mg-body").innerHTML = html;

  const poolEl = document.getElementById("sort-pool");
  const lawEl = document.getElementById("items-law");
  const graceEl = document.getElementById("items-grace");
  poolEl.innerHTML=""; lawEl.innerHTML=""; graceEl.innerHTML="";

  st.pool.forEach(item=>{
    if(!item.placed){
      const chip = document.createElement("span");
      chip.className = "pool-chip" + (st.selected===item.id ? " selected" : "");
      chip.textContent = item.text;
      chip.onclick = ()=>{ st.selected = st.selected===item.id ? null : item.id; renderSort(); };
      poolEl.appendChild(chip);
    } else {
      const tag = document.createElement("span");
      tag.className = "sort-target";
      tag.textContent = item.text + " ✕";
      tag.title = "Click to send back to the pool";
      tag.onclick = ()=>{ item.placed = null; renderSort(); };
      (item.placed === "law" ? lawEl : graceEl).appendChild(tag);
    }
  });

  document.getElementById("board-law").onclick = ()=>placeSelected("law");
  document.getElementById("board-grace").onclick = ()=>placeSelected("grace");

  const remaining = st.pool.filter(it=>!it.placed).length;
  document.getElementById("mg-actions").innerHTML = remaining===0
    ? '<button class="btn" onclick="checkSort()">Check My Sorting</button>'
    : '<span>'+remaining+' item(s) left to sort — click one, then click a side.</span>';
}
function placeSelected(side){
  const st = MG.sortState;
  if(!st.selected) return;
  const item = st.pool.find(it=>it.id===st.selected);
  if(item){ item.placed = side; st.selected = null; renderSort(); }
}
function checkSort(){
  const st = MG.sortState;
  const wrong = st.pool.filter(it=>it.placed !== it.side);
  const fb = document.getElementById("mg-feedback");
  if(wrong.length===0){
    fb.className = "feedback-banner show good";
    fb.textContent = "Every element is on the correct side of the tree.";
    document.getElementById("mg-actions").innerHTML = '<button class="btn gold" onclick="advanceMinigame()">Continue</button>';
  } else {
    fb.className = "feedback-banner show bad";
    fb.textContent = wrong.length + " item(s) are on the wrong side. Click a misplaced tag to send it back to the pool, then try again.";
  }
}

/* ---------- QUIZ ENGINE ---------- */
let QZ = {};
function renderQuiz(numQuestions){
  const stop = STOPS[STATE.stopIndex];
  const n = numQuestions || Math.min(6, stop.quiz.length);
  const chosen = sample(stop.quiz, n).map(q=>{
    const correctText = q.choices[q.a];
    const choices = shuffle(q.choices);
    return { q: q.q, choices, correctText };
  });
  QZ = { list: chosen, index:0, correct:0, stopKey: stop.key, onDone: finishStop };
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const stop = STOPS[STATE.stopIndex];
  const total = QZ.list.length;
  const item = QZ.list[QZ.index];
  const html = header() + '<div class="sheet">' + homeLink() + proofStrip() +
    '<div class="stop-meta">Commission '+stop.num+' of '+STOPS.length+' &middot; '+esc(stop.city)+' &mdash; Scholar\'s Quiz</div>' +
    '<div class="quiz-progress">Question '+(QZ.index+1)+' of '+total+' <span class="score-badge">'+QZ.correct+' correct</span></div>' +
    '<p class="quiz-q">'+esc(item.q)+'</p>' +
    '<div class="quiz-choices" id="quiz-choices">' +
      item.choices.map((c,i)=>'<div class="choice" data-i="'+i+'" onclick="answerQuiz('+i+')">'+esc(c)+'</div>').join("") +
    '</div>' +
    '<div id="quiz-note"></div>' +
    '<div class="btn-row" id="quiz-actions"></div>' +
    '</div>';
  app.innerHTML = html;
}
function answerQuiz(i){
  const item = QZ.list[QZ.index];
  const choiceEls = document.querySelectorAll("#quiz-choices .choice");
  choiceEls.forEach(el=>el.classList.add("disabled"));
  const isCorrect = item.choices[i] === item.correctText;
  choiceEls.forEach((el,idx)=>{
    el.onclick = null;
    if(item.choices[idx] === item.correctText) el.classList.add("correct");
    else if(idx===i && !isCorrect) el.classList.add("incorrect");
  });
  if(isCorrect) QZ.correct++;
  STATE.totalAnswered++;
  if(isCorrect) STATE.score++;
  const nextLabel = (QZ.index === QZ.list.length-1) ? "See Results" : "Next Question";
  document.getElementById("quiz-actions").innerHTML = '<button class="btn" onclick="nextQuizQuestion()">'+nextLabel+'</button>';
}
function nextQuizQuestion(){
  QZ.index++;
  if(QZ.index >= QZ.list.length){
    QZ.onDone();
  } else {
    renderQuizQuestion();
  }
}
function finishStop(){
  const stop = STOPS[STATE.stopIndex];
  if(!STATE.completedStops.includes(stop.key)) STATE.completedStops.push(stop.key);
  if(STATE.mode === "solo"){
    STATE.stopIndex = Math.min(STATE.stopIndex+1, STOPS.length-1);
    writeSave(STATE);
  }
  renderStopResults();
}
function renderStopResults(){
  const stop = STOPS[STATE.stopIndex_finished !== undefined ? STATE.stopIndex_finished : STATE.stopIndex];
  const justFinished = STOPS.find(s=>s.key===QZ.stopKey);
  const isLast = STATE.completedStops.length === STOPS.length;
  let nextBtn;
  if(STATE.mode === "pair"){
    nextBtn = isLast
      ? '<button class="btn gold" onclick="renderCertificate()">Print the Final Pamphlet</button>'
      : '<button class="btn" onclick="swapRoleAndAdvance()">Swap Roles &amp; Continue</button>';
  } else {
    nextBtn = isLast
      ? '<button class="btn gold" onclick="renderCertificate()">Print the Final Pamphlet</button>'
      : '<button class="btn" onclick="advanceStop()">Next Commission</button>';
  }
  app.innerHTML = header() + '<div class="sheet">' + homeLink() + proofStrip() +
    '<h2 class="stop-title">Commission Stamped: '+esc(justFinished.title)+'</h2>' +
    '<div class="narrative-box"><p>You scored <b>'+QZ.correct+' of '+QZ.list.length+'</b> on the Scholar\'s Quiz. The master presses the shop\'s wax seal onto your proof sheet.</p></div>' +
    '<div class="btn-row">'+nextBtn+'</div>' +
    '</div>';
}
function advanceStop(){
  if(STATE.mode !== "solo"){
    const idx = STOPS.findIndex(s=>s.key===QZ.stopKey);
    STATE.stopIndex = Math.min(idx+1, STOPS.length-1);
  }
  renderStopIntro();
}
function swapRoleAndAdvance(){
  STATE.pairRole = STATE.pairRole === "Illuminator" ? "Scholar" : "Illuminator";
  advanceStop();
}

    "Manus et Ingenium — Hand and wit",
    "Verbum Impressum — The printed word",

  ];

    '<h2 class="stop-title">Study Hall</h2>' +
    '<div class="narrative-box"><p>Browse every commission at your own pace, or jump straight into an untimed practice quiz for any work.</p></div>' +
    '<div class="studyhall-grid" id="fact-grid"></div>' +
    '<h2 class="stop-title" style="margin-top:26px;">Vocabulary Ledger</h2>' +

    '</div>';

function studyPractice(key){
  const idx = STOPS.findIndex(s=>s.key===key);
  STATE.stopIndex = idx;
  const stop = STOPS[idx];
  QZ = {}; // fresh
  const n = Math.min(8, stop.quiz.length);
  const chosen = sample(stop.quiz, n).map(q=>{
    const correctText = q.choices[q.a];
    return { q:q.q, choices: shuffle(q.choices), correctText };
  });
  QZ = { list: chosen, index:0, correct:0, stopKey: stop.key, onDone: ()=>renderStudyResults() };
  renderQuizQuestion();
}
function renderStudyResults(){
  app.innerHTML = header() + '<div class="sheet">' + homeLink() +
    '<h2 class="stop-title">Practice Complete</h2>' +
    '<div class="narrative-box"><p>You scored '+QZ.correct+' of '+QZ.list.length+' on this practice set. Practice as many times as you like — the questions and answer order reshuffle every time.</p></div>' +
    '<div class="btn-row"><button class="btn" onclick="renderStudyHall()">Back to Study Hall</button></div>' +
    '</div>';
}

/* ---------- SPEED ROUND ---------- */
let SPEED = {};
function renderSpeedIntro(){
  app.innerHTML = header() + '<div class="sheet">' + homeLink() +
    '<h2 class="stop-title">Speed Round</h2>' +
    '<div class="narrative-box"><p>A randomized gauntlet pulling from every commission in the unit. Answer as many as you can before the ink dries. Best for a quick review the night before a test.</p></div>' +
    '<div class="btn-row">' +
      '<button class="btn" onclick="startSpeed(120)">2 Minutes</button>' +
      '<button class="btn" onclick="startSpeed(180)">3 Minutes</button>' +
      '<button class="btn" onclick="startSpeed(300)">5 Minutes</button>' +
    '</div></div>';
}
function startSpeed(seconds){
  const allQ = [];
  STOPS.forEach(s=> s.quiz.forEach(q=> allQ.push({...q, stop:s.title})));
  SPEED = {
    queue: shuffle(allQ),
    idx:0, correct:0, answered:0, timeLeft: seconds, timerId:null
  };
  renderSpeedQuestion();
  SPEED.timerId = setInterval(()=>{
    SPEED.timeLeft--;
    const t = document.getElementById("flash-timer-num");
    if(t) t.textContent = formatTime(SPEED.timeLeft);
    if(SPEED.timeLeft <= 0){
      clearInterval(SPEED.timerId);
      renderSpeedResults();
    }
  }, 1000);
}
function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return m+":"+(sec<10?"0":"")+sec;
}
function renderSpeedQuestion(){
  if(SPEED.idx >= SPEED.queue.length){ SPEED.queue = SPEED.queue.concat(shuffle(SPEED.queue)); }
  const raw = SPEED.queue[SPEED.idx];
  const correctText = raw.choices[raw.a];
  const choices = shuffle(raw.choices);
  SPEED.current = { q: raw.q, stop: raw.stop, choices, correctText };
  app.innerHTML = header() +
    '<div class="flash-timer"><span id="flash-timer-num">'+formatTime(SPEED.timeLeft)+'</span> remaining &middot; <span class="score-badge">'+SPEED.correct+' correct</span></div>' +
    '<div class="sheet">' + homeLink() +
    '<div class="stop-meta">From: '+esc(raw.stop)+'</div>' +
    '<p class="quiz-q">'+esc(raw.q)+'</p>' +
    '<div class="quiz-choices" id="quiz-choices">' +
      choices.map((c,i)=>'<div class="choice" data-i="'+i+'" onclick="answerSpeed('+i+')">'+esc(c)+'</div>').join("") +
    '</div></div>';
}
function answerSpeed(i){
  const cur = SPEED.current;
  const isCorrect = cur.choices[i] === cur.correctText;
  SPEED.answered++;
  if(isCorrect) SPEED.correct++;
  SPEED.idx++;
  setTimeout(()=>{
    if(SPEED.timeLeft>0) renderSpeedQuestion();
  }, isCorrect ? 120 : 500);
  const els = document.querySelectorAll("#quiz-choices .choice");
  els.forEach((el,idx)=>{
    el.onclick=null;
    if(cur.choices[idx]===cur.correctText) el.classList.add("correct");
    else if(idx===i) el.classList.add("incorrect");
  });
}
function renderSpeedResults(){
  const best = parseInt(localStorage.getItem("inkSymbols_speedBest")||"0",10);
  const newBest = Math.max(best, SPEED.correct);
  localStorage.setItem("inkSymbols_speedBest", newBest);
  app.innerHTML = header() + '<div class="sheet">' + homeLink() +
    '<h2 class="stop-title">Ink\'s Dry — Time\'s Up</h2>' +
    '<div class="narrative-box"><p>You answered <b>'+SPEED.answered+'</b> questions and got <b>'+SPEED.correct+'</b> correct.</p>' +
    '<p>Personal best on this device: <b>'+newBest+'</b> correct.</p></div>' +
    '<div class="btn-row"><button class="btn" onclick="renderSpeedIntro()">Run It Again</button></div>' +
    '</div>';
}

/* ---------- MAIN RENDER SWITCH ---------- */
function render(){
  if(STATE.mode === null){ renderTitle(); return; }
  if(STATE.mode === "study"){ renderStudyHall(); return; }
  if(STATE.mode === "speed"){ renderSpeedIntro(); return; }
  // solo or pair
  renderStopIntro();
}

render();

window.STOPS = STOPS;
window.VOCAB = VOCAB;
window.__debug = { getState:()=>STATE, getMG:()=>MG, getQZ:()=>QZ, getSpeed:()=>SPEED };
